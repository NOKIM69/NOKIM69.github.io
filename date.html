<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokim Time & Date | نوکیم</title>
    <style>
        :root {
            --primary-color: #0078d4; /* رنگِ کلاسیکِ مایکروسافت */
            --bg-color: #f3f3f3;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        #clock {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
            font-family: 'Courier New', Courier, monospace; /* برای ثباتِ اعداد */
        }

        #date-en {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 5px;
        }

        #date-fa {
            font-size: 1.4rem;
            color: var(--primary-color);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .sync-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .sync-btn:hover {
            background-color: #005a9e;
            transform: translateY(-2px);
        }

        .sync-btn:active {
            transform: translateY(0);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            height: 20px;
            color: #28a745;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* انیمیشن برای لحظه سینک شدن */
        .syncing {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Nokim Time Center</h1>
    
    <div id="date-en">Loading...</div>
    <div id="clock">00:00:00</div>
    <div id="date-fa">در حال بارگذاری...</div>

    <button class="sync-btn" onclick="syncTime()">
        <span>🔄</span> آپدیت ساعت و تاریخ
    </button>

    <div id="status" class="status-msg">زمان با موفقیت همگام شد!</div>
</div>

<!-- کتابخانه برای تاریخ شمسی (بسیار سبک و عالی) -->
<script src="https://cdn.jsdelivr.net/npm/moment-jalaali@0.9.2/build/moment-jalaali.min.js"></script>

<script>
    let timeOffset = 0; // اختلاف زمانی بین سیستم کاربر و سرور

    function updateDisplay() {
        const now = new Date(new Date().getTime() + timeOffset);
        
        // آپدیت ساعت
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

        // آپدیت تاریخ میلادی
        const optionsEn = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date-en').textContent = now.toLocaleDateString('en-US', optionsEn);

        // آپدیت تاریخ شمسی با استفاده از moment-jalaali
        const jDate = moment(now).format('jD jMMMM jYYYY');
        const jWeekday = moment(now).format('dddd'); // روز هفته به فارسی
        document.getElementById('date-fa').textContent = `${jWeekday}، ${jDate}`;
    }

    // تابع اصلی برای همگام‌سازی (مثل ویندوز ۷)
    async function syncTime() {
        const btn = document.querySelector('.sync-btn');
        const status = document.getElementById('status');
        
        btn.classList.add('syncing');
        btn.textContent = "در حال همگام‌سازی...";
        status.style.opacity = "0";

        try {
            // استفاده از یک API برای گرفتن زمان دقیق جهانی
            const response = await fetch('https://worldtimeapi.org/api/ip');
            const data = await response.json();
            
            const serverTime = new Date(data.datetime);
            const localTime = new Date();
            
            // محاسبه اختلاف زمانی
            timeOffset = serverTime.getTime() - localTime.getTime();

            // نمایش موفقیت
            setTimeout(() => {
                btn.classList.remove('syncing');
                btn.innerHTML = "<span>🔄</span> آپدیت ساعت و تاریخ";
                status.style.opacity = "1";
                setTimeout(() => { status.style.opacity = "0"; }, 3000);
            }, 1000);

        } catch (error) {
            console.error("Sync failed:", error);
            btn.classList.remove('syncing');
            btn.innerHTML = "<span>❌</span> خطا در اتصال";
            alert("خطا در دریافت زمان از سرور! لطفا اینترنت خود را بررسی کنید.");
        }
    }

    // اجرای مداوم ساعت
    setInterval(updateDisplay, 1000);
    updateDisplay();
    
    // اولین اجرا برای پر کردن مقادیر
    syncTime(); 
</script>

</body>
</html>
