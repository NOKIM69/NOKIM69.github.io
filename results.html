
<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="themeColor">
<meta name="description" content="Nokim Explorer - جستجوی وب">
<title>Nokim Explorer</title>

<style>
:root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #202124;
    --muted: #5f6368;
    --border: #dadce0;
    --blue: #1a73e8;
    --hover: #f1f3f4;
    --soft: #f8f9fa;
    --shadow: 0 2px 10px rgba(60,64,67,.12);
}

html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121212;
    --surface: #202124;
    --text: #e8eaed;
    --muted: #bdc1c6;
    --border: #3c4043;
    --blue: #8ab4f8;
    --hover: #303134;
    --soft: #202124;
    --shadow: 0 2px 12px rgba(0,0,0,.25);
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s, color .2s;
}

button, input, select {
    font: inherit;
}

button {
    color: inherit;
}

a {
    color: var(--blue);
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 3px;
}

/* نوار بالایی */

.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px max(16px, env(safe-area-inset-right));
    background: var(--surface);
    border-bottom: 1px solid var(--border);
}

.logo {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    gap: 7px;
    text-decoration: none;
    color: var(--blue);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.7px;
}

.logo-mark {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 34px;
    height: 34px;
    border-radius: 12px;
    background: var(--blue);
    color: #fff;
    font-size: 20px;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-inline-start: auto;
}

.icon-button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    font-size: 21px;
}

.icon-button:hover {
    background: var(--hover);
}

/* بخش جستجو */

.search-area {
    width: min(100% - 32px, 760px);
    margin: 30px auto 20px;
}

.search-heading {
    margin: 0 0 18px;
    text-align: center;
    font-size: clamp(25px, 5vw, 36px);
    font-weight: 750;
    letter-spacing: -.8px;
}

.search-heading span {
    color: var(--blue);
}

.search-subtitle {
    margin: -9px 0 22px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
}

.search-form {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 54px;
    padding: 5px 8px 5px 7px;
    border: 1px solid var(--border);
    border-radius: 30px;
    background: var(--surface);
    box-shadow: var(--shadow);
}

.search-form:focus-within {
    border-color: var(--blue);
    box-shadow: 0 2px 12px rgba(26,115,232,.12);
}

.search-symbol {
    padding-inline-start: 9px;
    color: var(--muted);
    font-size: 21px;
}

.search-input {
    flex: 1;
    width: 0;
    min-width: 0;
    padding: 10px 0;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 16px;
}

.search-input::placeholder {
    color: var(--muted);
    opacity: .9;
}

.clear-button {
    display: none;
    flex-shrink: 0;
}

.search-button {
    flex-shrink: 0;
    min-width: 42px;
    height: 42px;
    padding: 0 14px;
    border: 0;
    border-radius: 24px;
    background: var(--blue);
    color: #fff;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
}

.search-button:hover {
    filter: brightness(.96);
}

.quick-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 17px;
}

.quick-button {
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--soft);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
}

.quick-button:hover {
    background: var(--hover);
}

/* تب‌های جستجو */

.tabs-wrap {
    position: sticky;
    top: 59px;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
}

.tabs {
    display: flex;
    gap: 25px;
    width: min(100% - 32px, 760px);
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: thin;
    overscroll-behavior-x: contain;
}

.tab {
    flex-shrink: 0;
    padding: 14px 3px 12px;
    border: 0;
    border-bottom: 3px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    font-size: 14px;
}

.tab.active {
    border-bottom-color: var(--blue);
    color: var(--blue);
    font-weight: 700;
}

/* نتایج */

.main-container {
    width: min(100% - 32px, 760px);
    min-height: 250px;
    margin: 22px auto 50px;
}

.result-stats {
    margin-bottom: 22px;
    color: var(--muted);
    font-size: 13px;
}

.result-item {
    margin-bottom: 27px;
    overflow-wrap: anywhere;
}

.result-site-info {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    min-width: 0;
}

.favicon-fallback {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--soft);
    font-size: 15px;
}

.site-info-text {
    min-width: 0;
    overflow: hidden;
}

.result-domain {
    display: block;
    overflow: hidden;
    color: var(--text);
    font-size: 13px;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.result-url {
    display: block;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    text-decoration: none;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.result-title {
    display: inline-block;
    margin-bottom: 5px;
    color: var(--blue);
    font-size: 20px;
    line-height: 1.45;
    text-decoration: none;
    overflow-wrap: anywhere;
}

.result-title:hover {
    text-decoration: underline;
}

.result-snippet {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.status-box {
    padding: 30px 16px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--soft);
    color: var(--muted);
    text-align: center;
    line-height: 1.9;
}

.status-icon {
    margin-bottom: 10px;
    font-size: 30px;
}

.status-title {
    margin-bottom: 5px;
    color: var(--text);
    font-size: 17px;
    font-weight: 650;
}

.status-box button {
    margin-top: 12px;
    padding: 9px 16px;
    border: 0;
    border-radius: 20px;
    background: var(--blue);
    color: white;
    cursor: pointer;
}

.spinner {
    display: inline-block;
    width: 30px;
    height: 30px;
    border: 3px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* پاورقی */

.footer {
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--soft);
    color: var(--muted);
    font-size: 13px;
}

.footer-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
    width: min(100%, 1000px);
    margin: 0 auto;
}

.footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
}

.footer a {
    color: var(--muted);
    text-decoration: none;
}

.footer a:hover {
    text-decoration: underline;
}

.footer-controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
}

.footer select {
    max-width: 145px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
}

/* موبایل */

@media (max-width: 600px) {
    .topbar {
        padding: 9px 12px;
        gap: 8px;
    }

    .logo {
        font-size: 19px;
    }

    .logo-mark {
        width: 31px;
        height: 31px;
        border-radius: 10px;
    }

    .icon-button {
        width: 38px;
        height: 38px;
    }

    .search-area {
        width: calc(100% - 28px);
        margin: 24px auto 18px;
    }

    .search-heading {
        margin-bottom: 17px;
    }

    .search-subtitle {
        font-size: 13px;
    }

    .search-form {
        min-height: 50px;
        gap: 5px;
    }

    .search-button {
        min-width: 40px;
        height: 40px;
        padding: 0 11px;
    }

    .quick-links {
        gap: 7px;
    }

    .quick-button {
        padding: 8px 11px;
    }

    .tabs-wrap {
        top: 56px;
    }

    .tabs {
        width: calc(100% - 24px);
        gap: 20px;
    }

    .main-container {
        width: calc(100% - 30px);
        margin-top: 18px;
    }

    .result-title {
        font-size: 18px;
    }

    .result-snippet {
        font-size: 14px;
        line-height: 1.85;
    }

    .footer-inner {
        align-items: flex-start;
        flex-direction: column;
    }
}

@media (max-width: 360px) {
    .logo {
        font-size: 17px;
    }

    .top-actions {
        gap: 0;
    }

    .search-heading {
        font-size: 26px;
    }

    .search-button {
        padding: 0 9px;
        font-size: 13px;
    }

    .tabs {
        gap: 16px;
    }

    .result-title {
        font-size: 17px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <a class="logo" href="NOKIM.html" aria-label="صفحه اصلی NOKIM">
        <span class="logo-mark">N</span>
        <span>NOKIM</span>
    </a>

    <div class="top-actions">
        <button class="icon-button" id="themeButton"
                type="button" aria-label="تغییر حالت روشن و تاریک"
                title="حالت تاریک">🌙</button>
    </div>
</header>

<section class="search-area">
    <h1 class="search-heading"><span>Nokim</span> Explorer</h1>
    <p class="search-subtitle" id="subtitle">جستجو در وب، ساده‌تر از همیشه</p>

    <form class="search-form" id="searchForm">
        <span class="search-symbol" aria-hidden="true">⌕</span>

        <input
            class="search-input"
            id="searchInput"
            type="search"
            name="q"
            placeholder="عبارت موردنظر را جستجو کنید..."
            autocomplete="off"
            enterkeyhint="search"
            aria-label="عبارت جستجو"
        >

        <button class="icon-button clear-button" id="clearButton"
                type="button" aria-label="پاک کردن جستجو">×</button>

        <button class="search-button" id="searchButton" type="submit">
            جستجو
        </button>
    </form>

    <div class="quick-links" id="quickLinks">
        <button class="quick-button" type="button" data-quick="Wikipedia">
            📚 ویکی‌پدیا
        </button>
        <button class="quick-button" type="button" data-quick="technology">
            💻 فناوری
        </button>
        <button class="quick-button" type="button" data-quick="NOKIM">
            🔎 NOKIM
        </button>
    </div>
</section>

<nav class="tabs-wrap" aria-label="دسته‌بندی نتایج">
    <div class="tabs" role="tablist">
        <button class="tab active" type="button" role="tab"
                aria-selected="true" data-tab="all" id="tabAll">همه</button>

        <button class="tab" type="button" role="tab"
                aria-selected="false" data-tab="wiki" id="tabWiki">ویکی‌پدیا</button>

        <button class="tab" type="button" role="tab"
                aria-selected="false" data-tab="images" id="tabImages">تصاویر</button>

        <button class="tab" type="button" role="tab"
                aria-selected="false" data-tab="videos" id="tabVideos">ویدیو</button>

        <button class="tab" type="button" role="tab"
                aria-selected="false" data-tab="news" id="tabNews">اخبار</button>
    </div>
</nav>

<main class="main-container">
    <div class="result-stats" id="resultStats" aria-live="polite"></div>
    <div id="resultList" aria-live="polite"></div>
</main>

<footer class="footer">
    <div class="footer-inner">
        <div>
            <div>© 2026 NOKIM Corporation. All rights reserved</div>
            <div class="footer-links" style="margin-top:12px">
                <a href="https://nokim69.github.io/about.html" id="footerAbout">درباره</a>
                <a href="privacy.html" id="footerPrivacy">حریم خصوصی</a>
                <a href="terms.html" id="footerTerms">شرایط استفاده</a>
            </div>
        </div>

        <div class="footer-controls">
            <label for="langSelector" id="langLabel">زبان:</label>
            <select id="langSelector">
                <option value="fa">فارسی</option>
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="tr">Türkçe</option>
                <option value="zh">中文</option>
            </select>
        </div>
    </div>
</footer>

<script>
(function () {
    "use strict";

    const $ = id => document.getElementById(id);

    const translations = {
        fa: {
            title: "Nokim Explorer - جستجو",
            subtitle: "جستجو در وب، ساده‌تر از همیشه",
            placeholder: "عبارت موردنظر را جستجو کنید...",
            search: "جستجو",
            all: "همه",
            wiki: "ویکی‌پدیا",
            images: "تصاویر",
            videos: "ویدیو",
            news: "اخبار",
            about: "درباره",
            privacy: "حریم خصوصی",
            terms: "شرایط استفاده",
            language: "زبان:",
            loading: "در حال جستجو...",
            noResults: "نتیجه‌ای پیدا نشد.",
            error: "ارتباط با سرویس جستجو برقرار نشد.",
            retry: "تلاش دوباره",
            empty: "برای شروع، عبارت موردنظر را در کادر بالا بنویسید.",
            wikiStats: "نتایج ویکی‌پدیا",
            unavailable: "این بخش هنوز به سرویس جستجوی اختصاصی متصل نشده است.",
            count: n => n + " نتیجه",
            themeLight: "حالت روشن",
            themeDark: "حالت تاریک",
            tabTitle: "نتایج جستجو",
            direction: "rtl"
        },
        en: {
            title: "Nokim Explorer - Search",
            subtitle: "Explore the web, simply",
            placeholder: "Search the web...",
            search: "Search",
            all: "All",
            wiki: "Wikipedia",
            images: "Images",
            videos: "Videos",
            news: "News",
            about: "About",
            privacy: "Privacy",
            terms: "Terms of Use",
            language: "Language:",
            loading: "Searching...",
            noResults: "No results found.",
            error: "Could not connect to the search service.",
            retry: "Try again",
            empty: "Enter a search query above to get started.",
            wikiStats: "Wikipedia results",
            unavailable: "This section is not connected to a dedicated search service yet.",
            count: n => n + " results",
            themeLight: "Light mode",
            themeDark: "Dark mode",
            tabTitle: "Search results",
            direction: "ltr"
        },
        ru: {
            title: "Nokim Explorer - Поиск",
            subtitle: "Простой поиск в интернете",
            placeholder: "Введите запрос...",
            search: "Поиск",
            all: "Все",
            wiki: "Википедия",
            images: "Изображения",
            videos: "Видео",
            news: "Новости",
            about: "О нас",
            privacy: "Конфиденциальность",
            terms: "Условия",
            language: "Язык:",
            loading: "Поиск...",
            noResults: "Результаты не найдены.",
            error: "Не удалось подключиться к поиску.",
            retry: "Повторить",
            empty: "Введите запрос в поле выше.",
            wikiStats: "Результаты Википедии",
            unavailable: "Этот раздел пока не подключён к поисковому сервису.",
            count: n => "Результатов: " + n,
            themeLight: "Светлая тема",
            themeDark: "Тёмная тема",
            tabTitle: "Результаты поиска",
            direction: "ltr"
        },
        tr: {
            title: "Nokim Explorer - Arama",
            subtitle: "İnternette kolayca arayın",
            placeholder: "Arama yapın...",
            search: "Ara",
            all: "Tümü",
            wiki: "Vikipedi",
            images: "Görseller",
            videos: "Videolar",
            news: "Haberler",
            about: "Hakkında",
            privacy: "Gizlilik",
            terms: "Kullanım şartları",
            language: "Dil:",
            loading: "Aranıyor...",
            noResults: "Sonuç bulunamadı.",
            error: "Arama hizmetine bağlanılamadı.",
            retry: "Tekrar dene",
            empty: "Başlamak için bir arama yazın.",
            wikiStats: "Vikipedi sonuçları",
            unavailable: "Bu bölüm henüz bir arama hizmetine bağlı değil.",
            count: n => n + " sonuç",
            themeLight: "Açık tema",
            themeDark: "Koyu tema",
            tabTitle: "Arama sonuçları",
            direction: "ltr"
        },
        zh: {
            title: "Nokim Explorer - 搜索",
            subtitle: "轻松探索互联网",
            placeholder: "输入搜索内容...",
            search: "搜索",
            all: "全部",
            wiki: "维基百科",
            images: "图片",
            videos: "视频",
            news: "新闻",
            about: "关于",
            privacy: "隐私",
            terms: "使用条款",
            language: "语言:",
            loading: "正在搜索...",
            noResults: "没有找到结果。",
            error: "无法连接到搜索服务。",
            retry: "重试",
            empty: "请输入搜索内容。",
            wikiStats: "维基百科结果",
            unavailable: "此部分尚未连接专用搜索服务。",
            count: n => n + " 条结果",
            themeLight: "浅色模式",
            themeDark: "深色模式",
            tabTitle: "搜索结果",
            direction: "ltr"
        }
    };

    let currentLang = "fa";
    let currentQuery = "";
    let activeTab = "all";
    let requestNumber = 0;

    const searchInput = $("searchInput");
    const resultList = $("resultList");
    const resultStats = $("resultStats");
    const loadingThemeColor = $("themeColor");

    function t() {
        return translations[currentLang] || translations.fa;
    }

    function getValidLang(value) {
        return Object.prototype.hasOwnProperty.call(translations, value)
            ? value : "fa";
    }

    function setText(id, value) {
        $(id).textContent = value;
    }

    function updateLanguage() {
        const tr = t();

        document.documentElement.lang = currentLang;
        document.documentElement.dir = tr.direction;
        document.title = currentQuery
            ? currentQuery + " - " + tr.title
            : tr.title;

        setText("subtitle", tr.subtitle);
        searchInput.placeholder = tr.placeholder;
        setText("searchButton", tr.search);
        setText("tabAll", tr.all);
        setText("tabWiki", tr.wiki);
        setText("tabImages", tr.images);
        setText("tabVideos", tr.videos);
        setText("tabNews", tr.news);
        setText("footerAbout", tr.about);
        setText("footerPrivacy", tr.privacy);
        setText("footerTerms", tr.terms);
        setText("langLabel", tr.language);

        updateThemeButton();
    }

    function readTheme() {
        try {
            return localStorage.getItem("nokim-theme") || "light";
        } catch (e) {
            return "light";
        }
    }

    function setTheme(theme) {
        const dark = theme === "dark";

        document.documentElement.dataset.theme = dark ? "dark" : "light";
        loadingThemeColor.content = dark ? "#121212" : "#ffffff";

        try {
            localStorage.setItem("nokim-theme", dark ? "dark" : "light");
        } catch (e) {}

        updateThemeButton();
    }

    function updateThemeButton() {
        const dark = document.documentElement.dataset.theme === "dark";
        $("themeButton").textContent = dark ? "☀️" : "🌙";
        $("themeButton").title = dark ? t().themeLight : t().themeDark;
        $("themeButton").setAttribute(
            "aria-label",
            dark ? t().themeLight : t().themeDark
        );
    }

    function updateURL() {
        const params = new URLSearchParams();

        if (currentQuery) params.set("q", currentQuery);
        params.set("lang", currentLang);

        if (activeTab !== "all") params.set("tab", activeTab);

        const newURL = location.pathname + "?" + params.toString();

        try {
            history.replaceState(null, "", newURL);
        } catch (e) {}
    }

    function showStatus(icon, title, message, retry) {
        resultList.replaceChildren();

        const box = document.createElement("div");
        box.className = "status-box";

        const iconEl = document.createElement("div");
        iconEl.className = "status-icon";
        iconEl.textContent = icon;
        box.appendChild(iconEl);

        const titleEl = document.createElement("div");
        titleEl.className = "status-title";
        titleEl.textContent = title;
        box.appendChild(titleEl);

        const messageEl = document.createElement("div");
        messageEl.textContent = message;
        box.appendChild(messageEl);

        if (retry) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = t().retry;
            button.addEventListener("click", () => runSearch(currentQuery));
            box.appendChild(button);
        }

        resultList.appendChild(box);
    }

    function makeResult(title, url, snippet) {
        const item = document.createElement("article");
        item.className = "result-item";

        const siteInfo = document.createElement("div");
        siteInfo.className = "result-site-info";

        const icon = document.createElement("div");
        icon.className = "favicon-fallback";
        icon.textContent = "🌐";
        icon.setAttribute("aria-hidden", "true");
        siteInfo.appendChild(icon);

        const infoText = document.createElement("div");
        infoText.className = "site-info-text";

        let hostname = url;

        try {
            hostname = new URL(url).hostname;
        } catch (e) {}

        const domain = document.createElement("span");
        domain.className = "result-domain";
        domain.textContent = hostname;
        infoText.appendChild(domain);

        const address = document.createElement("a");
        address.className = "result-url";
        address.href = url;
        address.target = "_blank";
        address.rel = "noopener noreferrer";
        address.textContent = url;
        infoText.appendChild(address);

        siteInfo.appendChild(infoText);
        item.appendChild(siteInfo);

        const heading = document.createElement("a");
        heading.className = "result-title";
        heading.href = url;
        heading.target = "_blank";
        heading.rel = "noopener noreferrer";
        heading.textContent = title;
        item.appendChild(heading);

        const description = document.createElement("div");
        description.className = "result-snippet";
        description.textContent = snippet || "";
        item.appendChild(description);

        return item;
    }

    function isHttpURL(value) {
        try {
            const parsed = new URL(value);
            return parsed.protocol === "https:" || parsed.protocol === "http:";
        } catch (e) {
            return false;
        }
    }

    async function fetchWithTimeout(url, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);

        try {
            const response = await fetch(url, {
                signal: controller.signal,
                headers: { "Accept": "text/html,text/plain,*/*" }
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            return await response.text();
        } finally {
            clearTimeout(timer);
        }
    }

    async function searchWeb(query, requestId) {
        const target = "https://html.duckduckgo.com/html/?q=" +
            encodeURIComponent(query);

        const proxies = [
            url => "https://api.allorigins.win/raw?url=" +
                encodeURIComponent(url),
            url => "https://corsproxy.io/?url=" +
                encodeURIComponent(url)
        ];

        let lastError = null;

        for (const makeProxy of proxies) {
            if (requestId !== requestNumber) return;

            try {
                const text = await fetchWithTimeout(makeProxy(target), 10000);

                if (requestId !== requestNumber) return;

                const parser = new DOMParser();
                const doc = parser.parseFromString(text, "text/html");
                const nodes = doc.querySelectorAll(".result");

                const results = [];

                nodes.forEach(node => {
                    const titleElement = node.querySelector(".result__title a");
                    const snippetElement = node.querySelector(".result__snippet");

                    if (!titleElement) return;

                    let url = titleElement.getAttribute("href") || "";

                    try {
                        const parsed = new URL(url, "https://duckduckgo.com");

                        if (parsed.hostname.includes("duckduckgo.com") &&
                            parsed.pathname.includes("/l/")) {
                            const redirect = parsed.searchParams.get("uddg");
                            if (redirect) url = redirect;
                        }
                    } catch (e) {}

                    if (!isHttpURL(url)) return;

                    const title = titleElement.textContent.trim();
                    const snippet = snippetElement
                        ? snippetElement.textContent.trim() : "";

                    if (!title) return;

                    results.push({ title, url, snippet });
                });

                if (results.length) {
                    if (requestId !== requestNumber) return;

                    resultList.replaceChildren();

                    results.forEach(result => {
                        resultList.appendChild(
                            makeResult(result.title, result.url, result.snippet)
                        );
                    });

                    resultStats.textContent = t().count(results.length);
                    return;
                }

                lastError = new Error("No results");
            } catch (e) {
                lastError = e;
            }
        }

        if (requestId !== requestNumber) return;

        if (lastError) {
            showStatus("⚠️", t().error,
                "اتصال اینترنت، محدودیت سرویس یا پراکسی را بررسی کنید.",
                true);
        } else {
            showStatus("🔎", t().noResults, "", false);
        }
    }

    async function searchWikipedia(query, requestId) {
        const apiURL = "https://" + currentLang +
            ".wikipedia.org/w/api.php?action=query&generator=search" +
            "&gsrsearch=" + encodeURIComponent(query) +
            "&gsrlimit=10&gsrnamespace=0&prop=extracts" +
            "&exintro=1&explaintext=1&exchars=400&format=json&origin=*";

        try {
            const response = await fetchWithTimeout(apiURL, 12000);

            if (requestId !== requestNumber) return;

            const data = JSON.parse(response);
            const pages = data.query && data.query.pages
                ? Object.values(data.query.pages) : [];

            resultList.replaceChildren();

            if (!pages.length) {
                showStatus("📚", t().noResults, "", false);
                resultStats.textContent = "";
                return;
            }

            pages.sort((a, b) => a.index - b.index);

            pages.forEach(page => {
                const url = "https://" + currentLang +
                    ".wikipedia.org/?curid=" + encodeURIComponent(page.pageid);

                resultList.appendChild(makeResult(
                    page.title,
                    url,
                    page.extract || ""
                ));
            });

            resultStats.textContent = t().wikiStats + " · " +
                t().count(pages.length);

        } catch (e) {
            if (requestId !== requestNumber) return;

            showStatus("⚠️", t().error,
                "اتصال به ویکی‌پدیا امکان‌پذیر نبود.", true);
        }
    }

    async function runSearch(query) {
        query = (query || "").trim();

        if (!query) {
            currentQuery = "";
            resultStats.textContent = "";
            showStatus("🔎", "Nokim Explorer", t().empty, false);
            updateURL();
            return;
        }

        currentQuery = query;
        searchInput.value = query;

        const thisRequest = ++requestNumber;

        updateURL();
        updateLanguage();

        resultStats.textContent = "";
        resultList.replaceChildren();

        const loadingBox = document.createElement("div");
        loadingBox.className = "status-box";

        const spinner = document.createElement("div");
        spinner.className = "spinner";
        spinner.setAttribute("aria-hidden", "true");
        loadingBox.appendChild(spinner);

        const loadingText = document.createElement("div");
        loadingText.style.marginTop = "14px";
        loadingText.textContent = t().loading;
        loadingBox.appendChild(loadingText);

        resultList.appendChild(loadingBox);

        if (activeTab === "wiki") {
            await searchWikipedia(query, thisRequest);
            return;
        }

        if (activeTab === "images" ||
            activeTab === "videos" ||
            activeTab === "news") {
            const label = activeTab === "images" ? t().images :
                activeTab === "videos" ? t().videos : t().news;

            showStatus("🚧", label, t().unavailable, false);
            return;
        }

        await searchWeb(query, thisRequest);
    }

    function selectTab(tab) {
        activeTab = tab;

        document.querySelectorAll(".tab").forEach(button => {
            const selected = button.dataset.tab === tab;

            button.classList.toggle("active", selected);
            button.setAttribute("aria-selected", String(selected));
        });

        updateURL();

        if (currentQuery) {
            runSearch(currentQuery);
        } else if (tab === "wiki") {
            showStatus("📚", t().wiki, t().empty, false);
        } else {
            showStatus("🔎", "Nokim Explorer", t().empty, false);
        }
    }

    $("searchForm").addEventListener("submit", function (event) {
        event.preventDefault();
        runSearch(searchInput.value);
    });

    $("clearButton").addEventListener("click", function () {
        searchInput.value = "";
        searchInput.focus();
        $("clearButton").style.display = "none";
    });

    searchInput.addEventListener("input", function () {
        $("clearButton").style.display =
            searchInput.value ? "inline-flex" : "none";
    });

    $("themeButton").addEventListener("click", function () {
        const isDark =
            document.documentElement.dataset.theme === "dark";

        setTheme(isDark ? "light" : "dark");
    });

    $("langSelector").addEventListener("change", function () {
        currentLang = getValidLang(this.value);
        updateLanguage();
        updateURL();

        if (currentQuery) {
            runSearch(currentQuery);
        }
    });

    document.querySelectorAll(".tab").forEach(button => {
        button.addEventListener("click", function () {
            selectTab(this.dataset.tab);
        });
    });

    document.querySelectorAll("[data-quick]").forEach(button => {
        button.addEventListener("click", function () {
            const value = this.dataset.quick;
            const query = value === "Wikipedia"
                ? "Wikipedia" : value;

            searchInput.value = query;
            runSearch(query);
        });
    });

    function init() {
        setTheme(readTheme());

        const params = new URLSearchParams(location.search);

        currentQuery = params.get("q") || "";
        currentLang = getValidLang(params.get("lang") || "fa");

        const requestedTab = params.get("tab");
        const validTabs = ["all", "wiki", "images", "videos", "news"];

        activeTab = validTabs.includes(requestedTab)
            ? requestedTab : "all";

        searchInput.value = currentQuery;
        $("langSelector").value = currentLang;

        $("clearButton").style.display =
            currentQuery ? "inline-flex" : "none";

        updateLanguage();

        document.querySelectorAll(".tab").forEach(button => {
            const selected = button.dataset.tab === activeTab;

            button.classList.toggle("active", selected);
            button.setAttribute("aria-selected", String(selected));
        });

        if (currentQuery) {
            runSearch(currentQuery);
        } else {
            showStatus("🔎", "Nokim Explorer", t().empty, false);
        }
    }

    init();
})();
</script>
