<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Nokim Explorer - نتایج جستجو</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --link-color: #1a0dab;
            --url-color: #202124;
            --domain-color: #4d5156;
            --snippet-color: #4d5156;
            --border-color: #dfe1e5;
            --hover-bg: #f8f9fa;
            --primary-blue: #1a73e8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* هدر جستجو */
        header {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-blue);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-form {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 6px 16px;
            width: 100%;
            max-width: 600px;
            background: #fff;
            box-shadow: 0 1px 6px rgba(32,33,36,.08);
        }

        .search-form:hover, .search-form:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,.16);
            border-color: rgba(223,225,229,0);
        }

        .search-form input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: var(--text-color);
        }

        .search-icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #5f6368;
            padding: 0 4px;
            display: flex;
            align-items: center;
        }

        /* تب‌ها */
        .tabs {
            display: flex;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            gap: 24px;
            background: #fff;
            font-size: 14px;
        }

        .tab {
            padding: 12px 4px;
            cursor: pointer;
            color: #5f6368;
            border-bottom: 3px solid transparent;
            user-select: none;
        }

        .tab.active {
            color: var(--primary-blue);
            border-bottom-color: var(--primary-blue);
            font-weight: bold;
        }

        /* محتوای اصلی نتایج */
        .main-container {
            max-width: 700px;
            margin: 20px 24px;
        }

        .result-stats {
            font-size: 13px;
            color: #70757a;
            margin-bottom: 16px;
        }

        .result-item {
            margin-bottom: 26px;
        }

        /* استایل سایت گوگل‌وار برای آدرس و فاوایکن */
        .result-site-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .result-favicon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            object-fit: contain;
        }

        .result-url-block {
            display: flex;
            flex-direction: column;
        }

        .result-domain {
            font-size: 12px;
            color: var(--domain-color);
            line-height: 1.2;
        }

        .result-url {
            font-size: 11px;
            color: #70757a;
            text-decoration: none;
            word-break: break-all;
            line-height: 1.2;
        }

        .result-title {
            font-size: 20px;
            color: var(--link-color);
            text-decoration: none;
            display: block;
            margin-bottom: 3px;
            line-height: 1.3;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-snippet {
            font-size: 14px;
            color: var(--snippet-color);
            line-height: 1.58;
        }

        /* لودینگ و خطاها */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #5f6368;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #70757a;
            font-size: 16px;
        }

        /* فوتر */
        footer {
            margin-top: 60px;
            background: #f2f2f2;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
            color: #70757a;
        }

        .footer-inner {
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .footer-left a {
            color: #70757a;
            text-decoration: none;
        }

        .footer-left a:hover {
            text-decoration: underline;
        }

        .footer-lang-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-lang-selector select {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 8px;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="Nokim.html" class="logo">⚡ NOKIM</a>
        <form class="search-form" onsubmit="handleNewSearch(event)">
            <input type="text" id="searchInput" autocomplete="off">
            <button type="submit" class="search-icon-btn" title="جستجو">🔍</button>
        </form>
    </header>

    <div class="tabs">
        <div class="tab active" data-tab="all" id="tabAll" onclick="switchTab('all')">همه</div>
        <div class="tab" data-tab="wiki" id="tabWiki" onclick="switchTab('wiki')">ویکی‌پدیا</div>
        <div class="tab" data-tab="images" id="tabImages" onclick="switchTab('images')">تصاویر</div>
        <div class="tab" data-tab="videos" id="tabVideos" onclick="switchTab('videos')">ویدیو</div>
        <div class="tab" data-tab="news" id="tabNews" onclick="switchTab('news')">اخبار</div>
    </div>

    <div class="main-container">
        <div id="resultStats" class="result-stats"></div>
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <span id="loadingText">در حال جستجو...</span>
        </div>
        <div id="resultList"></div>
    </div>

    <footer>
        <div class="footer-inner">
            <div class="footer-left">
                <span id="footerIran">🇮🇷 NOKIM Explorer Project</span>
                <a href="#" id="footerAbout">درباره</a>
                <a href="#" id="footerPrivacy">حریم خصوصی</a>
                <a href="#" id="footerTerms">شرایط</a>
            </div>
            <div class="footer-lang-selector">
                <span id="langLabel" style="font-size: 13px;">زبان:</span>
                <select id="langSelector" onchange="changeLanguage()">
                    <option value="fa">فارسی</option>
                    <option value="en">English</option>
                    <option value="ru">Русский</option>
                    <option value="tr">Türkçe</option>
                    <option value="zh">中文</option>
                </select>
            </div>
        </div>
    </footer>

    <script>
        const i18n = {
            fa: {
                title: "Nokim Explorer - نتایج جستجو",
                all: "همه", wiki: "ویکی‌پدیا", images: "تصاویر", videos: "ویدیو", news: "اخبار",
                loading: "در حال جستجو...",
                noResults: "نتیجه‌ای پیدا نشد 😕 لطفاً املای عبارت خود را بررسی کنید.",
                stats: (count, time) => `حدود ${count} نتیجه (${time} ثانیه)`,
                about: "درباره", privacy: "حریم خصوصی", terms: "شرایط",
                langText: "زبان:",
                dir: "rtl"
            },
            en: {
                title: "Nokim Explorer - Search Results",
                all: "All", wiki: "Wikipedia", images: "Images", videos: "Videos", news: "News",
                loading: "Searching...",
                noResults: "No results found 😕 Please check your spelling.",
                stats: (count, time) => `About ${count} results (${time}s)`,
                about: "About", privacy: "Privacy", terms: "Terms",
                langText: "Language:",
                dir: "ltr"
            },
            ru: {
                title: "Nokim Explorer - Результаты поиска",
                all: "Все", wiki: "Википедия", images: "Картинки", videos: "Видео", news: "Новости",
                loading: "Поиск...",
                noResults: "Результатов не найдено 😕",
                stats: (count, time) => `Результатов: примерно ${count} (${time} сек.)`,
                about: "О нас", privacy: "Конфиденциальность", terms: "Условия",
                langText: "Язык:",
                dir: "ltr"
            },
            tr: {
                title: "Nokim Explorer - Arama Sonuçları",
                all: "Tümü", wiki: "Vikipedi", images: "Görseller", videos: "Videolar", news: "Haberler",
                loading: "Aranıyor...",
                noResults: "Sonuç bulunamadı 😕",
                stats: (count, time) => `Yaklaşık ${count} sonuç bulundu (${time}s)`,
                about: "Hakkında", privacy: "Gizlilik", terms: "Şartlar",
                langText: "Dil:",
                dir: "ltr"
            },
            zh: {
                title: "Nokim Explorer - 搜索结果",
                all: "全部", wiki: "维基百科", images: "图片", videos: "视频", news: "新闻",
                loading: "正在搜索...",
                noResults: "未找到结果 😕",
                stats: (count, time) => `约有 ${count} 项结果 (${time}秒)`,
                about: "关于", privacy: "隐私", terms: "条款",
                langText: "语言:",
                dir: "ltr"
            }
        };

        let currentLang = 'fa';
        let currentQuery = '';
        let currentActiveTab = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentQuery = urlParams.get('q') || '';
            currentLang = urlParams.get('lang') || 'fa';

            document.getElementById('searchInput').value = currentQuery;
            document.getElementById('langSelector').value = currentLang;

            updateUILanguage();

            if (currentQuery) {
                executeSearch(currentQuery);
            }
        });

        function updateUILanguage() {
            const t = i18n[currentLang] || i18n.fa;
            document.getElementById('htmlRoot').setAttribute('dir', t.dir);
            document.getElementById('htmlRoot').setAttribute('lang', currentLang);
            document.getElementById('pageTitle').innerText = `${currentQuery ? currentQuery + ' - ' : ''}${t.title}`;
            
            document.getElementById('tabAll').innerText = t.all;
            document.getElementById('tabWiki').innerText = t.wiki;
            document.getElementById('tabImages').innerText = t.images;
            document.getElementById('tabVideos').innerText = t.videos;
            document.getElementById('tabNews').innerText = t.news;
            document.getElementById('loadingText').innerText = t.loading;
            
            document.getElementById('footerAbout').innerText = t.about;
            document.getElementById('footerPrivacy').innerText = t.privacy;
            document.getElementById('footerTerms').innerText = t.terms;
            document.getElementById('langLabel').innerText = t.langText;
        }

        function changeLanguage() {
            currentLang = document.getElementById('langSelector').value;
            updateUILanguage();
            if (currentQuery) {
                const newUrl = `results.html?q=${encodeURIComponent(currentQuery)}&lang=${currentLang}`;
                window.history.pushState({path: newUrl}, '', newUrl);
                executeSearch(currentQuery);
            }
        }

        function handleNewSearch(e) {
            e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if (q) {
                currentQuery = q;
                const newUrl = `results.html?q=${encodeURIComponent(q)}&lang=${currentLang}`;
                window.history.pushState({path: newUrl}, '', newUrl);
                executeSearch(q);
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            currentActiveTab = tabName;

            if (currentQuery) {
                if (tabName === 'wiki') {
                    fetchWikipediaResults(currentQuery);
                } else if (tabName === 'images') {
                    renderPlaceholderMessage(`🖼️ تصاویر برای "${currentQuery}" (به‌زودی...)`);
                } else if (tabName === 'videos') {
                    renderPlaceholderMessage(`🎬 ویدیوها برای "${currentQuery}" (به‌زودی...)`);
                } else if (tabName === 'news') {
                    renderPlaceholderMessage(`📰 اخبار برای "${currentQuery}" (به‌زودی...)`);
                } else {
                    executeSearch(currentQuery);
                }
            }
        }

        function renderPlaceholderMessage(msg) {
            document.getElementById('resultStats').innerText = '';
            document.getElementById('resultList').innerHTML = `<div class="no-results" style="font-size:18px;">${msg}</div>`;
        }

        // استخراج دامنه و ساخت آیکون گوگل (Favicon)
        function getFaviconAndDomain(link) {
            try {
                const urlObj = new URL(link);
                const domain = urlObj.hostname;
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
                return { domain, faviconUrl };
            } catch (e) {
                return { domain: link, faviconUrl: '' };
            }
        }

        async function executeSearch(query) {
            const startTime = performance.now();
            const loadingEl = document.getElementById('loading');
            const resultListEl = document.getElementById('resultList');
            const statsEl = document.getElementById('resultStats');

            loadingEl.style.display = 'block';
            resultListEl.innerHTML = '';
            statsEl.innerText = '';

            if (currentActiveTab === 'wiki') {
                fetchWikipediaResults(query);
                return;
            }

            let resultsHtml = '';

            try {
                const targetUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
                const htmlText = await fetchWithProxies(targetUrl);

                if (htmlText) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const items = doc.querySelectorAll('.result');

                    if (items.length > 0) {
                        let count = 0;
                        items.forEach(item => {
                            const titleEl = item.querySelector('.result__title');
                            const snippetEl = item.querySelector('.result__snippet');
                            const urlEl = item.querySelector('.result__url');

                            if (titleEl && snippetEl) {
                                const title = titleEl.textContent.trim();
                                const link = titleEl.querySelector('a')?.href || '#';
                                const snippet = snippetEl.textContent.trim();
                                
                                const { domain, faviconUrl } = getFaviconAndDomain(link);

                                resultsHtml += `
                                    <div class="result-item">
                                        <div class="result-site-info">
                                            <img src="${faviconUrl}" class="result-favicon" onerror="this.style.display='none'">
                                            <div class="result-url-block">
                                                <span class="result-domain">${domain}</span>
                                                <a href="${link}" class="result-url" target="_blank">${link}</a>
                                            </div>
                                        </div>
                                        <a href="${link}" class="result-title" target="_blank">${title}</a>
                                        <div class="result-snippet">${snippet}</div>
                                    </div>
                                `;
                                count++;
                            }
                        });

                        if (resultsHtml) {
                            const endTime = performance.now();
                            const duration = ((endTime - startTime) / 1000).toFixed(2);
                            const t = i18n[currentLang] || i18n.fa;
                            statsEl.innerText = t.stats(count * 12, duration);
                            resultListEl.innerHTML = resultsHtml;
                            loadingEl.style.display = 'none';
                            return;
                        }
                    }
                }
            } catch (err) {
                console.warn('Proxy search fallback triggered:', err);
            }

            loadingEl.style.display = 'none';
            const t = i18n[currentLang] || i18n.fa;
            resultListEl.innerHTML = `<div class="no-results">${t.noResults}</div>`;
        }

        async function fetchWithProxies(targetUrl) {
            const proxies = [
                (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
                (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            for (const getProxyUrl of proxies) {
                try {
                    const response = await fetch(getProxyUrl(targetUrl));
                    if (response.ok) {
                        const text = await response.text();
                        if (text && text.length > 100) return text;
                    }
                } catch (e) {
                    continue;
                }
            }
            return null;
        }

        async function fetchWikipediaResults(query) {
            const loadingEl = document.getElementById('loading');
            const resultListEl = document.getElementById('resultList');
            const statsEl = document.getElementById('resultStats');

            loadingEl.style.display = 'block';
            resultListEl.innerHTML = '';
            statsEl.innerText = '';

            const wikiLang = ['fa', 'en', 'ru', 'tr', 'zh'].includes(currentLang) ? currentLang : 'en';
            const wikiApiUrl = `https://${wikiLang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=10&namespace=0&format=json&origin=*`;

            try {
                const response = await fetch(wikiApiUrl);
                const data = await response.json();
                loadingEl.style.display = 'none';

                const titles = data[1] || [];
                const descriptions = data[2] || [];
                const urls = data[3] || [];

                if (titles.length === 0) {
                    const t = i18n[currentLang] || i18n.fa;
                    resultListEl.innerHTML = `<div class="no-results">${t.noResults}</div>`;
                    return;
                }

                statsEl.innerText = `Wikipedia (${titles.length} results)`;
                let html = '';
                for (let i = 0; i < titles.length; i++) {
                    const { domain, faviconUrl } = getFaviconAndDomain(urls[i]);
                    html += `
                        <div class="result-item">
                            <div class="result-site-info">
                                <img src="${faviconUrl}" class="result-favicon" onerror="this.style.display='none'">
                                <div class="result-url-block">
                                    <span class="result-domain">${domain}</span>
                                    <a href="${urls[i]}" class="result-url" target="_blank">${urls[i]}</a>
                                </div>
                            </div>
                            <a href="${urls[i]}" class="result-title" target="_blank">${titles[i]}</a>
                            <div class="result-snippet">${descriptions[i] || ''}</div>
                        </div>
                    `;
                }
                resultListEl.innerHTML = html;
            } catch (err) {
                loadingEl.style.display = 'none';
                resultListEl.innerHTML = `<div class="no-results">خطا در بارگذاری اطلاعات ویکی‌پدیا</div>`;
            }
        }
    </script>
</body>
</html>
