<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokim Explorer - نتایج جستجو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }
        body {
            background-color: #fff;
            color: #202124;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* هدر صفحه */
        header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #dfe1e5;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 20px;
            flex-wrap: wrap;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #202124;
            font-size: 22px;
            font-weight: bold;
        }
        .search-form {
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 6px 16px;
            width: 100%;
            max-width: 600px;
            background: #fff;
            box-shadow: none;
            transition: box-shadow 0.2s;
        }
        .search-form:hover, .search-form:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            border-color: rgba(223,225,229,0);
        }
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #202124;
        }
        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #4285f4;
            padding-right: 8px;
        }
        /* تب‌های جستجو */
        .tabs-bar {
            display: flex;
            padding: 0 160px;
            border-bottom: 1px solid #dfe1e5;
            background: #fff;
            gap: 20px;
            overflow-x: auto;
        }
        @media(max-width: 768px) {
            .tabs-bar { padding: 0 15px; }
            header { padding: 10px; gap: 10px; }
        }
        .tab-item {
            padding: 10px 12px;
            font-size: 14px;
            color: #5f6368;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            user-select: none;
            white-space: nowrap;
        }
        .tab-item.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
            font-weight: bold;
        }
        /* محتوای نتایج */
        .main-container {
            flex: 1;
            max-width: 750px;
            padding: 20px;
            margin-right: 150px;
        }
        @media(max-width: 900px) {
            .main-container { margin-right: 0; width: 100%; }
        }
        .status-msg {
            font-size: 13px;
            color: #70757a;
            margin-bottom: 15px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 4px;
            border: 1px solid #dadce0;
        }
        .result-card {
            margin-bottom: 24px;
        }
        .result-url {
            font-size: 12px;
            color: #202124;
            margin-bottom: 3px;
            word-break: break-all;
        }
        .result-title {
            font-size: 18px;
            color: #1a0dab;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 3px;
        }
        .result-title:hover {
            text-decoration: underline;
        }
        .result-snippet {
            font-size: 14px;
            color: #4d5156;
            line-height: 1.5;
        }
        /* فوتر */
        footer {
            background: #f2f2f2;
            border-top: 1px solid #dadce0;
            padding: 12px 20px;
            font-size: 13px;
            color: #70757a;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- هدر بالای صفحه -->
    <header>
        <a href="Nokim.html" class="logo-area">Nokim</a>
        <form class="search-form" id="searchForm" onsubmit="performSearch(event)">
            <input type="text" id="searchInput" class="search-input" placeholder="جستجو کنید ...">
            <button type="submit" class="search-btn">🔍</button>
        </form>
    </header>

    <!-- نوار تب‌ها -->
    <div class="tabs-bar">
        <div class="tab-item active" onclick="switchTab('all', this)">همه</div>
        <div class="tab-item" onclick="switchTab('wiki', this)">ویکی‌پدیا 📚</div>
        <div class="tab-item" onclick="switchTab('images', this)">تصاویر</div>
        <div class="tab-item" onclick="switchTab('videos', this)">ویدیو</div>
    </div>

    <!-- بدنه اصلی نتایج -->
    <div class="main-container">
        <div id="statusNotice" class="status-msg" style="display: none;"></div>
        <div id="resultsList">
            <div style="color: #70757a; margin-top: 20px;">در حال بارگذاری نتایج...</div>
        </div>
    </div>

    <!-- فوتر -->
    <footer>
        NOKIM Explorer &copy; 1405 - جستجوی هوشمند و سبک
    </footer>

    <script>
        let currentQuery = '';
        let currentTab = 'all';

        // خواندن پارامتر q از URL به هنگام لود صفحه
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            if (q) {
                currentQuery = q.trim();
                document.getElementById('searchInput').value = currentQuery;
                runSearchEngine(currentQuery, currentTab);
            } else {
                document.getElementById('resultsList').innerHTML = '<div style="color: #70757a;">لطفاً عبارتی را برای جستجو وارد کنید.</div>';
            }
        });

        // ارسال فرم جستجو
        function performSearch(e) {
            e.preventDefault();
            const val = document.getElementById('searchInput').value.trim();
            if (val) {
                window.location.href = `results.html?q=${encodeURIComponent(val)}`;
            }
        }

        // تغییر تب‌ها
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentTab = tabName;
            
            if (currentQuery) {
                runSearchEngine(currentQuery, currentTab);
            }
        }

        // موتور اصلی مدیریت منابع جستجو
        async function runSearchEngine(query, tab) {
            const resultsContainer = document.getElementById('resultsList');
            const notice = document.getElementById('statusNotice');
            
            resultsContainer.innerHTML = '<div style="color: #70757a; margin-top: 20px;">در حال جستجو...</div>';
            notice.style.display = 'none';

            if (tab === 'wiki') {
                // جستجو فقط در ویکی‌پدیا
                notice.style.display = 'block';
                notice.innerText = 'نتایج مستقیماً از ویکی‌پدیا فارسی دریافت شد.';
                const wikiResults = await fetchWikipedia(query);
                renderResults(wikiResults);
            } else if (tab === 'all') {
                // تب همه: ترکیب نتایج وب (DuckDuckGo) و ویکی‌پدیا
                notice.style.display = 'block';
                notice.innerText = 'نتایج از وب و ویکی‌پدیا دریافت شد.';
                
                const webResults = await fetchDuckDuckGoWithProxies(query);
                const wikiResults = await fetchWikipedia(query);
                
                // ادغام نتایج (ابتدا چند مورد ویکی و سپس وب)
                const combined = [...wikiResults.slice(0, 3), ...webResults];
                renderResults(combined);
            } else {
                // برای تصاویر و ویدیوها فعلاً پیام آزمایشی
                notice.style.display = 'none';
                resultsContainer.innerHTML = `<div style="color: #70757a; margin-top: 20px;">بخش ${elementText(tab)} در حال توسعه است...</div>`;
            }
        }

        // تابع دریافت اطلاعات از ویکی‌پدیا فارسی (بدون نیاز به پروکسی و کاملاً امن)
        async function fetchWikipedia(query) {
            const url = `https://fa.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=8&namespace=0&format=json&origin=*`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const titles = data[1];
                const descriptions = data[2];
                const links = data[3];

                let results = [];
                for (let i = 0; i < titles.length; i++) {
                    results.push({
                        title: titles[i],
                        snippet: descriptions[i] || 'مقاله مربوط در ویکی‌پدیا موجود است.',
                        url: links[i]
                    });
                }
                return results;
            } catch (err) {
                console.error("خطا در ارتباط با ویکی‌پدیا:", err);
                return [];
            }
        }

        // تابع دریافت نتایج وب با زنجیره پروکسی‌ها (Fallback)
        async function fetchDuckDuckGoWithProxies(query) {
            const targetUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
            ];

            for (let proxyUrl of proxies) {
                try {
                    const response = await fetch(proxyUrl);
                    if (!response.ok) continue;
                    const htmlText = await response.text();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const items = doc.querySelectorAll('.result');
                    
                    let results = [];
                    items.forEach(item => {
                        const titleEl = item.querySelector('.result__a') || item.querySelector('[data-testid="result-title-a"]');
                        const snippetEl = item.querySelector('.result__snippet');
                        
                        if (titleEl) {
                            results.push({
                                title: titleEl.textContent.trim(),
                                snippet: snippetEl ? snippetEl.textContent.trim() : '',
                                url: titleEl.getAttribute('href') || '#'
                            });
                        }
                    });

                    if (results.length > 0) {
                        return results;
                    }
                } catch (e) {
                    console.warn("پروکسی ناموفق بود، تلاش با بعدی...", e);
                }
            }
            return [];
        }

        // رندر کردن کارت‌های نتیجه در صفحه
        function renderResults(results) {
            const container = document.getElementById('resultsList');
            if (!results || results.length === 0) {
                container.innerHTML = '<div style="color: #70757a; margin-top: 20px;">هیچ نتیجه‌ای یافت نشد.</div>';
                return;
            }

            let html = '';
            results.forEach(item => {
                html += `
                    <div class="result-card">
                        <div class="result-url">${escapeHtml(item.url)}</div>
                        <a href="${escapeHtml(item.url)}" target="_blank" class="result-title">${escapeHtml(item.title)}</a>
                        <div class="result-snippet">${escapeHtml(item.snippet)}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // تابع کمکی برای جلوگیری از خطاهای اسکریپتی (امنیت XSS)
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        function elementText(tab) {
            if (tab === 'images') return 'تصاویر';
            if (tab === 'videos') return 'ویدیو';
            return '';
        }
    </script>
</body>
</html>
