<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nokim Explorer - نتایج جستجو</title>
<link rel="icon" type="image/x-icon" href="icon/NOKIM2026.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; }
  
  .search-header {
    position: fixed;
    top: 0;
    width: 100%;
    background: #fff;
    border-bottom: 1px solid #dadce0;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 100;
  }
  .search-header .logo-small {
    font-size: 24px;
    font-weight: bold;
    color: #3C3C3C;
    white-space: nowrap;
  }
  .search-header .search-box { flex: 1; max-width: 640px; }
  .search-header .search-container {
    display: flex;
    align-items: center;
    border: 1px solid #dadce0;
    border-radius: 24px;
    padding: 0 14px;
    height: 44px;
    background: #fff;
    box-shadow: 0 1px 6px rgba(32,33,36,0.28);
  }
  .search-header .search-container:hover,
  .search-header .search-container:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,0.28);
    border-color: transparent;
  }
  .search-header .search-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    color: #1f1f1f;
    background: transparent;
    height: 34px;
    font-family: Arial, sans-serif;
  }
  .search-header .search-icon { color: #9aa0a6; display: flex; align-items: center; margin-left: 8px; }
  .search-header .search-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #4285f4;
    display: flex;
    align-items: center;
  }
  
  .tools-bar {
    margin-top: 80px;
    padding: 0 20px;
    border-bottom: 1px solid #dadce0;
    display: flex;
    gap: 20px;
    font-size: 14px;
    color: #5f6368;
  }
  .tools-bar span {
    padding: 12px 0;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    user-select: none;
  }
  .tools-bar span.active {
    color: #1a73e8;
    border-bottom-color: #1a73e8;
  }
  
  .results {
    max-width: 652px;
    margin: 20px auto;
    padding: 0 20px;
  }
  .result-item {
    margin-bottom: 28px;
  }
  .result-url {
    font-size: 14px;
    color: #202124;
    line-height: 1.3;
  }
  .result-url span { color: #5f6368; }
  .result-title {
    font-size: 20px;
    color: #1a0dab;
    cursor: pointer;
    line-height: 1.3;
    margin: 4px 0;
  }
  .result-title:hover { text-decoration: underline; }
  .result-desc {
    font-size: 14px;
    color: #4d5156;
    line-height: 1.58;
  }
  
  .pagination {
    text-align: center;
    margin: 40px 0;
    font-size: 14px;
    color: #4285f4;
  }
  .pagination a {
    color: #4285f4;
    text-decoration: none;
    margin: 0 8px;
    cursor: pointer;
  }
  .pagination a:hover { text-decoration: underline; }
  .pagination a.disabled { color: #999; cursor: default; }
  
  .footer {
    background: #f3f5f6;
    padding: 15px 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    font-size: 15px;
    color: #1f1f1f;
  }
  .footer a {
    color: #1f1f1f;
    text-decoration: none;
    padding: 15px;
    white-space: nowrap;
  }
  .footer a:hover { text-decoration: underline; }
  
  .loading {
    text-align: center;
    padding: 50px;
    color: #70757a;
  }
  .spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #4285f4;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .error-msg {
    color: #d93025;
    text-align: center;
    padding: 30px;
    font-size: 16px;
  }
  .answer-box {
    background: #f8f9fa;
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .answer-box h3 {
    color: #1a73e8;
    margin-bottom: 8px;
    font-size: 18px;
  }
  .answer-box p { color: #3c4043; line-height: 1.6; }
  .notice {
    background: #e8f0fe;
    border: 1px solid #d2e3fc;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    color: #1967d2;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="search-header">
  <div class="logo-small">Nokim</div>
  <div class="search-box">
    <form id="searchForm" onsubmit="return doSearch()">
      <div class="search-container">
        <div class="search-icon">
          <svg focusable="false" height="20" viewBox="0 0 24 24" width="20">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"></path>
          </svg>
        </div>
        <input class="search-input" type="text" id="searchInput" placeholder="جستجو کنید ..." autofocus>
        <button class="search-btn" type="submit">
          <svg focusable="false" height="20" viewBox="0 0 24 24" width="20">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"></path>
          </svg>
        </button>
      </div>
    </form>
  </div>
</div>

<div class="tools-bar" id="toolsBar">
  <span class="active" data-mode="web">همه</span>
  <span data-mode="images">تصاویر</span>
  <span data-mode="video">ویدیو</span>
  <span data-mode="news">اخبار</span>
</div>

<div class="results" id="results">
  <div id="resultStats" style="color:#70757a;font-size:14px;margin-bottom:20px;"></div>
  <div id="notice"></div>
  <div id="resultList"></div>
  <div id="loading" class="loading" style="display:none;">
    <div class="spinner"></div>
    <p>در حال جستجو...</p>
  </div>
</div>

<div class="pagination" id="pagination"></div>

<div class="footer">
  <div>
    <a href="#">درباره</a>
    <a href="#">تبلیغ</a>
    <a href="#">تجارت</a>
    <a href="#">نحوه عملکرد جستجو</a>
  </div>
  <div>
    <a href="#">حریم خصوصی</a>
    <a href="#">شرایط</a>
    <a href="#">تنظیمات</a>
  </div>
</div>

<script>
let currentQuery = '';
let currentPage = 1;
let currentMode = 'web';

// ========== گرفتن کلمه جستجو از URL ==========
const urlParams = new URLSearchParams(window.location.search);
const query = urlParams.get('q') || '';

// ========== پر کردن باکس جستجو ==========
document.getElementById('searchInput').value = query;

// ========== مدیریت تب‌ها ==========
document.querySelectorAll('#toolsBar span').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#toolsBar span').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    currentPage = 1;
    if (currentQuery) searchAll(1);
  });
});

// ========== تابع کمکی: استخراج نتایج از HTML ==========
function parseHTMLResults(html) {
  const results = [];
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  
  // نتایج DuckDuckGo HTML
  const items = doc.querySelectorAll('.result');
  items.forEach(item => {
    const linkEl = item.querySelector('a.result__a');
    const snippetEl = item.querySelector('.result__snippet');
    if (linkEl) {
      results.push({
        title: linkEl.textContent.trim(),
        link: linkEl.href,
        url: linkEl.hostname,
        desc: snippetEl ? snippetEl.textContent.trim() : ''
      });
    }
  });
  
  // اگه کلاس دیگه‌ای داشت (نسخه‌های جدیدتر)
  if (results.length === 0) {
    const links = doc.querySelectorAll('a[data-testid="result-title-a"]');
    links.forEach(linkEl => {
      const parent = linkEl.closest('article') || linkEl.parentElement;
      const snippetEl = parent ? parent.querySelector('[data-testid="result-snippet"]') : null;
      results.push({
        title: linkEl.textContent.trim(),
        link: linkEl.href,
        url: linkEl.hostname,
        desc: snippetEl ? snippetEl.textContent.trim() : ''
      });
    });
  }
  
  return results;
}

// ========== جستجو با پروکسی (HTML DuckDuckGo) ==========
async function searchViaProxy(q) {
  const proxies = [
    { name: 'allorigins', url: (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}` },
    { name: 'corsproxy', url: (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}` },
    { name: 'codetabs', url: (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}` }
  ];
  
  const searchUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(q)}`;
  
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy.url(searchUrl));
      if (!res.ok) continue;
      const html = await res.text();
      const results = parseHTMLResults(html);
      if (results.length > 0) {
        return { results, source: proxy.name };
      }
    } catch (e) {
      // ادامه بده به پروکسی بعدی
    }
  }
  return { results: [], source: null };
}

// ========== جستجوی اصلی (ترکیبی) ==========
async function searchAll(page = 1) {
  if (!query && !currentQuery) {
    document.getElementById('resultStats').textContent = 'لطفاً یک کلمه جستجو وارد کنید.';
    return;
  }
  
  const q = query || currentQuery;
  currentQuery = q;
  currentPage = page;
  
  const loading = document.getElementById('loading');
  const resultList = document.getElementById('resultList');
  const resultStats = document.getElementById('resultStats');
  const pagination = document.getElementById('pagination');
  const notice = document.getElementById('notice');
  
  loading.style.display = 'block';
  resultList.innerHTML = '';
  pagination.innerHTML = '';
  notice.innerHTML = '';
  resultStats.textContent = `در حال جستجوی "${q}" ...`;
  
  // ===== مرحله ۱: API رسمی DuckDuckGo =====
  let answerHtml = '';
  let apiResults = [];
  let usedAPI = false;
  
  try {
    const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1&t=nokim`;
    const response = await fetch(url);
    const data = await response.json();
    
    // پاسخ فوری (Instant Answer)
    if (data.AbstractText) {
      usedAPI = true;
      answerHtml = `
        <div class="answer-box">
          <h3>${data.Heading || 'پاسخ'}</h3>
          <p>${data.AbstractText}</p>
          ${data.AbstractURL ? `<p style="margin-top:8px;"><a href="${data.AbstractURL}" target="_blank" style="color:#1a73e8;">منبع بیشتر ↗</a></p>` : ''}
        </div>
      `;
    }
    
    // نتایج مرتبط
    if (data.RelatedTopics) {
      data.RelatedTopics.forEach(topic => {
        if (topic.Text) {
          apiResults.push({
            title: topic.Text.split(' - ')[0] || topic.Text,
            desc: topic.Text,
            link: topic.FirstURL || '#',
            url: topic.FirstURL ? new URL(topic.FirstURL).hostname : ''
          });
        }
        if (topic.Topics) {
          topic.Topics.forEach(sub => {
            if (sub.Text) {
              apiResults.push({
                title: sub.Text.split(' - ')[0] || sub.Text,
                desc: sub.Text,
                link: sub.FirstURL || '#',
                url: sub.FirstURL ? new URL(sub.FirstURL).hostname : ''
              });
            }
          });
        }
      });
    }
  } catch (e) {
    // API رسمی خطا داد، برو سراغ پروکسی
  }
  
  // ===== مرحله ۲: اگه API نتیجه نداشت، پروکسی =====
  let proxyResults = [];
  let proxySource = null;
  
  if (apiResults.length === 0 && !answerHtml) {
    const proxyResult = await searchViaProxy(q);
    proxyResults = proxyResult.results;
    proxySource = proxyResult.source;
  }
  
  loading.style.display = 'none';
  
  const allResults = apiResults.length > 0 ? apiResults : proxyResults;
  
  if (answerHtml || allResults.length > 0) {
    resultStats.textContent = `${allResults.length} نتیجه برای "${q}"`;
    
    if (proxySource) {
      notice.innerHTML = `<div class="notice">نتایج از طریق ${proxySource} دریافت شد</div>`;
    }
    
    let content = answerHtml;
    
    if (currentMode === 'web') {
      content += allResults.map(r => `
        <div class="result-item">
          <div class="result-url">${r.url} <span>▾</span></div>
          <div class="result-title" onclick="window.open('${r.link}','_blank')">${r.title}</div>
          <div class="result-desc">${r.desc}</div>
        </div>
      `).join('');
    } else if (currentMode === 'images') {
      content += allResults.map(r => `
        <div class="result-item">
          <div class="result-url">🖼️ ${r.url} <span>▾</span></div>
          <div class="result-title" onclick="window.open('${r.link}','_blank')">${r.title}</div>
          <div class="result-desc">${r.desc}</div>
        </div>
      `).join('');
    } else if (currentMode === 'video') {
      content += allResults.map(r => `
        <div class="result-item">
          <div class="result-url">🎬 ${r.url} <span>▾</span></div>
          <div class="result-title" onclick="window.open('${r.link}','_blank')">${r.title}</div>
          <div class="result-desc">${r.desc}</div>
        </div>
      `).join('');
    } else if (currentMode === 'news') {
      content += allResults.map(r => `
        <div class="result-item">
          <div class="result-url">📰 ${r.url} <span>▾</span></div>
          <div class="result-title" onclick="window.open('${r.link}','_blank')">${r.title}</div>
          <div class="result-desc">${r.desc}</div>
        </div>
      `).join('');
    }
    
    resultList.innerHTML = content;
    
    // صفحه‌بندی
    pagination.innerHTML = `
      <a class="${currentPage <= 1 ? 'disabled' : ''}" onclick="searchAll(${currentPage - 1})">قبلی</a>
      <span style="color:#5f6368;">صفحه ${currentPage}</span>
      <a onclick="searchAll(${currentPage + 1})">بعدی</a>
    `;
    
  } else {
    resultStats.textContent = `نتیجه‌ای برای "${q}" یافت نشد.`;
    resultList.innerHTML = `
      <div style="text-align:center;padding:40px;color:#70757a;">
        <p style="font-size:18px;">نتیجه‌ای پیدا نشد 😕</p>
        <p style="margin-top:10px;">مطمئن شو کلمه رو درست نوشتی یا یه چیز دیگه جستجو کن</p>
      </div>
    `;
  }
}

// ========== جستجوی جدید از فرم ==========
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return false;
  window.location.href = `results.html?q=${encodeURIComponent(q)}`;
  return false;
}

// ========== اجرا ==========
if (query) searchAll();
</script>

</body>
     </html>
