<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Nokim Explorer - Search</title>

<style>
:root {
    --bg: #ffffff;
    --text: #202124;
    --muted: #5f6368;
    --blue: #1a0dab;
    --green: #188038;
    --border: #dfe1e5;
    --soft: #f8f9fa;
    --input: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.6;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    text-decoration: none;
}

/* Header */
.header {
    padding: 18px 22px 0;
    border-bottom: 1px solid var(--border);
}

.topline {
    display: flex;
    align-items: center;
    gap: 22px;
}

.logo {
    font-size: 29px;
    font-weight: 700;
    letter-spacing: -1.5px;
    white-space: nowrap;
}

.logo .n1 { color: #4285f4; }
.logo .n2 { color: #ea4335; }
.logo .n3 { color: #fbbc05; }
.logo .n4 { color: #4285f4; }
.logo .n5 { color: #34a853; }
.logo .n6 { color: #ea4335; }

.search-area {
    width: min(100%, 690px);
}

.search-box {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 46px;
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 0 15px;
    background: var(--input);
    box-shadow: 0 1px 5px rgba(32,33,36,.10);
    transition: box-shadow .15s;
}

.search-box:hover,
.search-box:focus-within {
    box-shadow: 0 1px 7px rgba(32,33,36,.22);
}

.search-icon {
    color: #4285f4;
    font-size: 20px;
    margin-inline-end: 10px;
}

#searchInput {
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    width: 100%;
    min-width: 0;
    font-size: 16px;
}

.clear-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 21px;
    padding: 0 7px;
}

.search-button {
    border: 0;
    background: transparent;
    color: #4285f4;
    font-size: 20px;
    padding: 4px;
}

.header-tools {
    margin-inline-start: auto;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tool-btn {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 11px;
    background: var(--bg);
    color: var(--text);
    white-space: nowrap;
}

.tool-btn:hover {
    background: var(--soft);
}

.tabs-wrap {
    max-width: 690px;
    margin-inline-start: 0;
    margin-top: 20px;
    overflow-x: auto;
    scrollbar-width: none;
}

.tabs-wrap::-webkit-scrollbar {
    display: none;
}

.tabs {
    display: flex;
    gap: 25px;
    white-space: nowrap;
    min-width: max-content;
}

.tab {
    display: inline-block;
    padding: 0 2px 12px;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    background: transparent;
    border-top: 0;
    border-left: 0;
    border-right: 0;
}

.tab.active {
    color: #4285f4;
    border-bottom-color: #4285f4;
}

/* Results layout */
.main {
    width: min(100% - 40px, 650px);
    margin: 18px 0 40px;
    margin-inline-start: 22px;
}

.stats {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 22px;
}

.result {
    margin-bottom: 27px;
    overflow-wrap: anywhere;
}

.result-site {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 3px;
    min-width: 0;
}

.favicon {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 26px;
    height: 26px;
    flex: 0 0 26px;
    border-radius: 50%;
    background: #f1f3f4;
    color: #5f6368;
    font-size: 13px;
    overflow: hidden;
}

.favicon img {
    width: 18px;
    height: 18px;
    object-fit: contain;
}

.site-info {
    min-width: 0;
}

.site-name {
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.site-url {
    font-size: 12px;
    color: var(--muted);
    direction: ltr;
    text-align: start;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.result-title {
    display: inline-block;
    font-size: 20px;
    line-height: 1.35;
    font-weight: 400;
    color: var(--blue);
    margin: 1px 0 4px;
}

.result-title:hover {
    text-decoration: underline;
}

.result-snippet {
    color: #4d5156;
    font-size: 14px;
    line-height: 1.65;
    margin: 0;
}

.result-snippet b,
.result-snippet strong {
    color: var(--text);
}

.empty {
    padding: 18px 0 30px;
    color: var(--muted);
    line-height: 1.9;
}

.empty h2 {
    font-size: 18px;
    color: var(--text);
    font-weight: 400;
}

.loading {
    color: var(--muted);
    padding: 25px 0;
}

.spinner {
    display: inline-block;
    width: 17px;
    height: 17px;
    border: 2px solid #dadce0;
    border-top-color: #4285f4;
    border-radius: 50%;
    vertical-align: middle;
    margin-inline-end: 8px;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.footer {
    border-top: 1px solid var(--border);
    padding: 16px 22px;
    color: var(--muted);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
}

.footer a {
    color: var(--muted);
}

.footer a:hover {
    text-decoration: underline;
}

/* Dark mode */
body.dark {
    --bg: #202124;
    --text: #e8eaed;
    --muted: #bdc1c6;
    --blue: #8ab4f8;
    --green: #81c995;
    --border: #3c4043;
    --soft: #303134;
    --input: #202124;
}

body.dark .search-box {
    box-shadow: none;
}

body.dark .result-snippet {
    color: #bdc1c6;
}

body.dark .favicon {
    background: #303134;
    color: #bdc1c6;
}

/* Mobile */
@media (max-width: 600px) {
    .header {
        padding: 13px 14px 0;
    }

    .topline {
        flex-wrap: wrap;
        gap: 12px;
    }

    .logo {
        font-size: 25px;
    }

    .search-area {
        order: 3;
        width: 100%;
    }

    .header-tools {
        margin-inline-start: auto;
    }

    .tool-btn {
        padding: 6px 9px;
        font-size: 12px;
    }

    .search-box {
        min-height: 44px;
    }

    #searchInput {
        font-size: 16px;
    }

    .tabs-wrap {
        margin-top: 16px;
    }

    .tabs {
        gap: 21px;
    }

    .tab {
        padding-bottom: 10px;
    }

    .main {
        width: auto;
        margin: 17px 16px 32px;
    }

    .stats {
        font-size: 12px;
        margin-bottom: 20px;
    }

    .result {
        margin-bottom: 25px;
    }

    .result-title {
        font-size: 18px;
    }

    .result-snippet {
        font-size: 14px;
    }

    .footer {
        padding: 15px 16px;
    }
}

@media (max-width: 350px) {
    .header-tools {
        gap: 4px;
    }

    .tool-btn {
        padding: 5px 7px;
    }

    .main {
        margin-inline: 12px;
    }

    .result-title {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="topline">

        <a href="#" class="logo" aria-label="Nokim Explorer" onclick="goHome(event)">
            <span class="n1">N</span><span class="n2">o</span><span class="n3">k</span><span class="n4">i</span><span class="n5">m</span>
            <span style="color:var(--muted);font-size:15px;letter-spacing:0"> Explorer</span>
        </a>

        <div class="search-area">
            <form class="search-box" id="searchForm">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input
                    id="searchInput"
                    type="search"
                    placeholder="جست‌وجو در وب..."
                    autocomplete="off"
                    aria-label="عبارت جست‌وجو"
                >
                <button class="clear-btn" type="button" id="clearButton" aria-label="پاک کردن">×</button>
                <button class="search-button" type="submit" aria-label="جست‌وجو">⌕</button>
            </form>
        </div>

        <div class="header-tools">
            <button class="tool-btn" id="languageButton" type="button">فارسی ▾</button>
            <button class="tool-btn" id="themeButton" type="button" aria-label="تغییر پوسته">☾</button>
        </div>
    </div>

    <nav class="tabs-wrap" aria-label="دسته‌های جست‌وجو">
        <div class="tabs">
            <button class="tab active" data-tab="all" type="button">همه</button>
            <button class="tab" data-tab="images" type="button">تصاویر</button>
            <button class="tab" data-tab="videos" type="button">ویدیوها</button>
            <button class="tab" data-tab="news" type="button">اخبار</button>
            <button class="tab" data-tab="wiki" type="button">ویکی‌پدیا</button>
        </div>
    </nav>
</header>

<main class="main">
    <div id="stats" class="stats">برای شروع، عبارتی را جست‌وجو کنید.</div>
    <section id="results" aria-live="polite">
        <div class="empty">
            <h2>به Nokim Explorer خوش آمدید</h2>
            عبارت موردنظرتان را در کادر بالا وارد کنید و دکمهٔ جست‌وجو را بزنید.
        </div>
    </section>
</main>

<footer class="footer">
    <span>© 2026 NOKIM</span>
    <a href="https://nokim69.github.io/" target="_blank" rel="noopener noreferrer">وب‌سایت NOKIM</a>
    <a href="https://nokim69.github.io/about.html" target="_blank" rel="noopener noreferrer">دربارهٔ ما</a>
</footer>

<script>
const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");
const resultsBox = document.getElementById("results");
const statsBox = document.getElementById("stats");
const clearButton = document.getElementById("clearButton");
const themeButton = document.getElementById("themeButton");
const languageButton = document.getElementById("languageButton");

let currentTab = "all";
let currentLanguage = "fa";
let requestNumber = 0;

const translations = {
    fa: {
        placeholder: "جست‌وجو در وب...",
        all: "همه",
        images: "تصاویر",
        videos: "ویدیوها",
        news: "اخبار",
        wiki: "ویکی‌پدیا",
        search: "برای شروع، عبارتی را جست‌وجو کنید.",
        welcome: "به Nokim Explorer خوش آمدید",
        welcomeText: "عبارت موردنظرتان را در کادر بالا وارد کنید و دکمهٔ جست‌وجو را بزنید.",
        loading: "در حال جست‌وجو...",
        results: "نتایج جست‌وجو",
        noResults: "نتیجه‌ای پیدا نشد.",
        noResultsText: "عبارت دیگری را امتحان کنید یا املای آن را بررسی کنید.",
        error: "جست‌وجو در حال حاضر انجام نشد.",
        errorText: "ممکن است سرویس جست‌وجو یا واسط اتصال موقتاً در دسترس نباشد. دوباره تلاش کنید.",
        tabMessage: "این بخش هنوز مستقیماً به سرویس مربوط وصل نشده است.",
        openSearch: "جست‌وجوی این عبارت در DuckDuckGo",
        language: "فارسی ▾"
    },
    en: {
        placeholder: "Search the web...",
        all: "All",
        images: "Images",
        videos: "Videos",
        news: "News",
        wiki: "Wikipedia",
        search: "Enter a search term to get started.",
        welcome: "Welcome to Nokim Explorer",
        welcomeText: "Enter a search term above and press the search button.",
        loading: "Searching...",
        results: "Search results",
        noResults: "No results found.",
        noResultsText: "Try another search term or check your spelling.",
        error: "Search is currently unavailable.",
        errorText: "The search service or connection proxy may be temporarily unavailable. Please try again.",
        tabMessage: "This section is not directly connected to its service yet.",
        openSearch: "Search this query on DuckDuckGo",
        language: "English ▾"
    }
};

function t(key) {
    return translations[currentLanguage][key] || key;
}

function setLanguage(lang) {
    currentLanguage = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";

    searchInput.placeholder = t("placeholder");
    languageButton.textContent = t("language");

    document.querySelectorAll(".tab").forEach(button => {
        button.textContent = t(button.dataset.tab);
    });

    if (searchInput.value.trim()) {
        runSearch(searchInput.value.trim());
    } else {
        statsBox.textContent = t("search");
        resultsBox.innerHTML = `
            <div class="empty">
                <h2>${escapeHTML(t("welcome"))}</h2>
                ${escapeHTML(t("welcomeText"))}
            </div>`;
    }
}

languageButton.addEventListener("click", () => {
    setLanguage(currentLanguage === "fa" ? "en" : "fa");
});

themeButton.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    themeButton.textContent = isDark ? "☀" : "☾";
    localStorage.setItem("nokim-theme", isDark ? "dark" : "light");
});

if (localStorage.getItem("nokim-theme") === "dark") {
    document.body.classList.add("dark");
    themeButton.textContent = "☀";
}

clearButton.addEventListener("click", () => {
    searchInput.value = "";
    searchInput.focus();
    statsBox.textContent = t("search");
    resultsBox.innerHTML = `
        <div class="empty">
            <h2>${escapeHTML(t("welcome"))}</h2>
            ${escapeHTML(t("welcomeText"))}
        </div>`;
});

searchForm.addEventListener("submit", event => {
    event.preventDefault();
    runSearch(searchInput.value.trim());
});

document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
        button.classList.add("active");
        currentTab = button.dataset.tab;

        if (searchInput.value.trim()) {
            runSearch(searchInput.value.trim());
        }
    });
});

function goHome(event) {
    event.preventDefault();
    searchInput.value = "";
    statsBox.textContent = t("search");
    resultsBox.innerHTML = `
        <div class="empty">
            <h2>${escapeHTML(t("welcome"))}</h2>
            ${escapeHTML(t("welcomeText"))}
        </div>`;
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function showLoading() {
    statsBox.textContent = t("loading");
    resultsBox.innerHTML = `
        <div class="loading">
            <span class="spinner"></span>${escapeHTML(t("loading"))}
        </div>`;
}

function showMessage(title, message, query = "") {
    statsBox.textContent = "";
    resultsBox.innerHTML = `
        <div class="empty">
            <h2>${escapeHTML(title)}</h2>
            <p>${escapeHTML(message)}</p>
            ${query ? `
                <p>
                    <a class="result-title"
                       href="https://duckduckgo.com/?q=${encodeURIComponent(query)}"
                       target="_blank"
                       rel="noopener noreferrer">
                       ${escapeHTML(t("openSearch"))}
                    </a>
                </p>` : ""}
        </div>`;
}

function getDomain(url) {
    try {
        return new URL(url).hostname.replace(/^www\./, "");
    } catch {
        return url;
    }
}

function makeResult(title, url, snippet) {
    const item = document.createElement("article");
    item.className = "result";

    const siteRow = document.createElement("div");
    siteRow.className = "result-site";

    const favicon = document.createElement("div");
    favicon.className = "favicon";

    const domain = getDomain(url);
    const icon = document.createElement("img");
    icon.alt = "";
    icon.loading = "lazy";
    icon.src = "https://www.google.com/s2/favicons?domain=" +
        encodeURIComponent(domain) + "&sz=64";
    icon.onerror = () => {
        favicon.textContent = "●";
        icon.remove();
    };
    favicon.appendChild(icon);

    const siteInfo = document.createElement("div");
    siteInfo.className = "site-info";

    const siteName = document.createElement("div");
    siteName.className = "site-name";
    siteName.textContent = domain;

    const siteURL = document.createElement("div");
    siteURL.className = "site-url";
    siteURL.textContent = url;

    siteInfo.append(siteName, siteURL);
    siteRow.append(favicon, siteInfo);

    const titleLink = document.createElement("a");
    titleLink.className = "result-title";
    titleLink.href = url;
    titleLink.target = "_blank";
    titleLink.rel = "noopener noreferrer";
    titleLink.textContent = title;

    const description = document.createElement("p");
    description.className = "result-snippet";
    description.textContent = snippet || "";

    item.append(siteRow, titleLink, description);
    return item;
}

async function runSearch(query) {
    if (!query) {
        statsBox.textContent = t("search");
        resultsBox.innerHTML = `
            <div class="empty">
                <h2>${escapeHTML(t("welcome"))}</h2>
                ${escapeHTML(t("welcomeText"))}
            </div>`;
        return;
    }

    const thisRequest = ++requestNumber;
    searchInput.value = query;
    showLoading();

    if (currentTab === "images" ||
        currentTab === "videos" ||
        currentTab === "news") {
        showMessage(t(currentTab), t("tabMessage"), query);
        return;
    }

    if (currentTab === "wiki") {
        await searchWikipedia(query, thisRequest);
        return;
    }

    try {
        const results = await searchDuckDuckGo(query);

        if (thisRequest !== requestNumber) return;

        if (!results.length) {
            showMessage(t("noResults"), t("noResultsText"), query);
            return;
        }

        statsBox.textContent = t("results") + " · " + results.length;
        resultsBox.replaceChildren();

        results.forEach(result => {
            resultsBox.appendChild(
                makeResult(result.title, result.url, result.snippet)
            );
        });
    } catch (error) {
        if (thisRequest !== requestNumber) return;
        showMessage(t("error"), t("errorText"), query);
    }
}

async function searchDuckDuckGo(query) {
    const targetURL =
        "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(query);

    const proxyURLs = [
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetURL),
        "https://corsproxy.io/?" + encodeURIComponent(targetURL)
    ];

    let lastError;

    for (const proxyURL of proxyURLs) {
        try {
            const response = await fetch(proxyURL, {
                method: "GET",
                headers: { "Accept": "text/html" }
            });

            if (!response.ok) {
                throw new Error("Search request failed");
            }

            const html = await response.text();
            const doc = new DOMParser().parseFromString(html, "text/html");
            const found = [];

            doc.querySelectorAll(".result").forEach(node => {
                const link = node.querySelector(".result__a");
                const snippet = node.querySelector(".result__snippet");

                if (!link) return;

                let url = link.getAttribute("href") || "";
                const title = (link.textContent || "").trim();
                const description = snippet
                    ? snippet.textContent.trim()
                    : "";

                try {
                    const parsed = new URL(url, "https://duckduckgo.com");

                    if (parsed.hostname.includes("duckduckgo.com") &&
                        parsed.pathname.includes("y.js")) {
                        return;
                    }

                    if (parsed.hostname.includes("duckduckgo.com") &&
                        parsed.searchParams.has("uddg")) {
                        url = parsed.searchParams.get("uddg");
                    } else {
                        url = parsed.href;
                    }
                } catch {
                    return;
                }

                if (!/^https?:\/\//i.test(url)) return;
                if (!title) return;

                found.push({
                    title,
                    url,
                    snippet: description
                });
            });

            if (found.length) return found;

            throw new Error("No parsed results");
        } catch (error) {
            lastError = error;
        }
    }

    throw lastError || new Error("Search unavailable");
}

async function searchWikipedia(query, thisRequest) {
    try {
        const lang = currentLanguage === "fa" ? "fa" : "en";
        const endpoint = "https://" + lang +
            ".wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" +
            encodeURIComponent(query) +
            "&gsrnamespace=0&gsrlimit=10&prop=extracts&exintro=1&explaintext=1&exsentences=2&format=json&origin=*";

        const response = await fetch(endpoint);

        if (!response.ok) throw new Error("Wikipedia request failed");

        const data = await response.json();

        if (thisRequest !== requestNumber) return;

        const pages = data.query && data.query.pages
            ? Object.values(data.query.pages)
            : [];

        if (!pages.length) {
            showMessage(t("noResults"), t("noResultsText"), query);
            return;
        }

        statsBox.textContent = t("results") + " · " + pages.length;
        resultsBox.replaceChildren();

        pages.sort((a, b) => a.index - b.index).forEach(page => {
            const url = "https://" + lang +
                ".wikipedia.org/?curid=" + encodeURIComponent(page.pageid);

            resultsBox.appendChild(
                makeResult(
                    page.title,
                    url,
                    page.extract || ""
                )
            );
        });
    } catch (error) {
        if (thisRequest !== requestNumber) return;
        showMessage(t("error"), t("errorText"), query);
    }
}

// Optional: accept ?q=search-term in the URL.
const params = new URLSearchParams(window.location.search);
const initialQuery = params.get("q");

if (initialQuery) {
    searchInput.value = initialQuery;
    runSearch(initialQuery);
}
</script>

</body>
</html>
