
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nokim Explorer</title>

  <link rel="icon" href="NOKIM2026.ico" type="image/x-icon">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      width: 100%;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #202124;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 8px 14px;
    }

    .header a {
      color: #202124;
      text-decoration: none;
      font-size: 14px;
      padding: 12px 8px;
    }

    .header a:hover {
      text-decoration: underline;
    }

    .main-content {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 70px;
    }

    .logo-text {
      max-width: 100%;
      margin-bottom: 28px;
      color: #3c4043;
      font-size: clamp(34px, 9vw, 72px);
      font-weight: bold;
      letter-spacing: -1.5px;
      text-align: center;
      overflow-wrap: anywhere;
      user-select: none;
    }

    .search-box {
      width: 100%;
      max-width: 584px;
    }

    .search-container {
      width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border: 1px solid #dadce0;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: box-shadow 0.2s ease;
    }

    .search-container:hover,
    .search-container:focus-within {
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.25);
    }

    .search-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 10px;
      color: #9aa0a6;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      height: 42px;
      border: none;
      outline: none;
      background: transparent;
      color: #202124;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }

    .search-input::placeholder {
      color: #70757a;
    }

    .search-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .search-buttons button {
      min-height: 40px;
      padding: 0 18px;
      border: 1px solid #f8f9fa;
      border-radius: 6px;
      background: #f8f9fa;
      color: #3c4043;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    .search-buttons button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .language-bar {
      max-width: 100%;
      margin-top: 28px;
      padding: 0 8px;
      color: #474747;
      font-size: 13px;
      line-height: 28px;
      text-align: center;
    }

    .language-bar a {
      display: inline-block;
      margin: 0 4px;
      color: #1a0dab;
      text-decoration: none;
      white-space: nowrap;
    }

    .language-bar a:hover {
      text-decoration: underline;
    }

    .footer {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 20px;
      background: #f3f5f6;
      color: #202124;
      font-size: 14px;
    }

    .footer-left,
    .footer-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    .footer a {
      display: inline-block;
      padding: 10px;
      color: #202124;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* تنظیمات گوشی */
    @media (max-width: 480px) {
      .header {
        padding: 6px 10px;
      }

      .main-content {
        padding: 20px 16px 40px;
      }

      .logo-text {
        font-size: clamp(32px, 9vw, 44px);
        letter-spacing: -1px;
        margin-bottom: 26px;
      }

      .search-container {
        height: 46px;
        padding: 0 12px;
      }

      .search-buttons {
        gap: 8px;
        margin-top: 18px;
      }

      .search-buttons button {
        padding: 0 12px;
        font-size: 13px;
      }

      .language-bar {
        margin-top: 22px;
        font-size: 12px;
      }

      .footer {
        justify-content: center;
        padding: 8px;
        font-size: 13px;
      }

      .footer-left,
      .footer-right {
        justify-content: center;
      }

      .footer a {
        padding: 8px;
      }
    }

    /* گوشی‌های بسیار کوچک */
    @media (max-width: 350px) {
      .main-content {
        padding-right: 12px;
        padding-left: 12px;
      }

      .logo-text {
        font-size: 30px;
      }

      .search-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .search-buttons button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="https://nokim69.github.io/about.html" data-i18n="about">
      درباره
    </a>
  </header>

  <main class="main-content">

    <div class="logo-text" id="logoText">
      Nokim Explorer
    </div>

    <div class="search-box">
      <form id="searchForm" action="results.html" method="GET">

        <div class="search-container">
          <div class="search-icon" aria-hidden="true">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5
                6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59
                4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z
                M9.5 14A4.5 4.5 0 1 1 9.5 5a4.5 4.5 0 0 1 0 9z"
                fill="currentColor"
              />
            </svg>
          </div>

          <input
            class="search-input"
            id="searchInput"
            type="search"
            name="q"
            placeholder="جستجو کنید ..."
            aria-label="عبارت جستجو"
            autocomplete="off"
            required
          >
        </div>

        <div class="search-buttons">
          <button type="submit" data-i18n="searchBtn">
            جستجوی Nokim
          </button>

          <button
            type="submit"
            name="btnI"
            value="1"
            data-i18n="luckyBtn"
          >
            احساس خوش‌شانسی می‌کنم
          </button>
        </div>

      </form>
    </div>

    <div class="language-bar">
      <span id="langLabel">
        Nokim Explorer به این زبان ارائه می‌شود:
      </span>

      <a href="#" data-lang="en">English</a>
      <a href="#" data-lang="ru">Русский</a>
      <a href="#" data-lang="tr">Türkçe</a>
      <a href="#" data-lang="zh">中文</a>
      <a href="#" data-lang="fa">فارسی</a>
    </div>

  </main>

  <footer class="footer">
    <div class="footer-left">
      <a href="https://nokim69.github.io/about.html" data-i18n="about">
        درباره
      </a>
    </div>

    <div class="footer-right">
      <a href="https://nokim69.github.io/about.html" data-i18n="privacy">
        حریم خصوصی
      </a>
    </div>
  </footer>

  <script>
    const translations = {
      fa: {
        title: "Nokim Explorer",
        placeholder: "جستجو کنید ...",
        searchBtn: "جستجوی Nokim",
        luckyBtn: "احساس خوش‌شانسی می‌کنم",
        langLabel: "Nokim Explorer به این زبان ارائه می‌شود:",
        about: "درباره",
        privacy: "حریم خصوصی"
      },

      en: {
        title: "Nokim Explorer",
        placeholder: "Search...",
        searchBtn: "Nokim Search",
        luckyBtn: "I'm Feeling Lucky",
        langLabel: "Nokim Explorer is offered in:",
        about: "About",
        privacy: "Privacy"
      },

      ru: {
        title: "Nokim Explorer",
        placeholder: "Поиск...",
        searchBtn: "Поиск Nokim",
        luckyBtn: "Мне повезёт",
        langLabel: "Nokim Explorer доступен на следующих языках:",
        about: "О нас",
        privacy: "Конфиденциальность"
      },

      tr: {
        title: "Nokim Explorer",
        placeholder: "Arama yapın...",
        searchBtn: "Nokim'de Ara",
        luckyBtn: "Kendimi Şanslı Hissediyorum",
        langLabel: "Nokim Explorer şu dillerde sunulmaktadır:",
        about: "Hakkında",
        privacy: "Gizlilik"
      },

      zh: {
        title: "Nokim Explorer",
        placeholder: "搜索...",
        searchBtn: "搜索 Nokim",
        luckyBtn: "手气不错",
        langLabel: "Nokim Explorer 提供以下语言：",
        about: "关于",
        privacy: "隐私"
      }
    };

    function detectLanguage() {
      const browserLang = (
        navigator.language ||
        navigator.userLanguage ||
        "fa"
      ).toLowerCase();

      if (browserLang.startsWith("ru")) return "ru";
      if (browserLang.startsWith("tr")) return "tr";
      if (browserLang.startsWith("zh")) return "zh";
      if (browserLang.startsWith("en")) return "en";

      return "fa";
    }

    function applyLanguage(lang) {
      const t = translations[lang];

      if (!t) return;

      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
      document.title = t.title;

      document.getElementById("logoText").textContent = t.title;
      document.getElementById("searchInput").placeholder = t.placeholder;
      document.getElementById("langLabel").textContent = t.langLabel;

      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;

        if (t[key]) {
          element.textContent = t[key];
        }
      });

      localStorage.setItem("nokimLang", lang);
    }

    document.querySelectorAll("[data-lang]").forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        applyLanguage(link.dataset.lang);
      });
    });

    document.getElementById("searchForm").addEventListener("submit", event => {
      const input = document.getElementById("searchInput");

      if (!input.value.trim()) {
        event.preventDefault();
        input.focus();
      }
    });

    const savedLanguage = localStorage.getItem("nokimLang");
    const initialLanguage =
      savedLanguage && translations[savedLanguage]
        ? savedLanguage
        : detectLanguage();

    applyLanguage(initialLanguage);
  </script>

</body>
</html>
```
