<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود Nokim Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 700;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #8b949e;
            margin-top: 8px;
            font-size: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #161b22;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        thead {
            background: #1c2333;
        }

        th {
            padding: 16px 20px;
            text-align: right;
            font-weight: 600;
            font-size: 14px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        th:last-child {
            text-align: center;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #21262d;
            font-size: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .version {
            font-weight: 700;
            color: #58a6ff;
            font-size: 16px;
        }

        .date {
            color: #8b949e;
            font-size: 14px;
        }

        .download-link {
            display: inline-block;
            padding: 8px 22px;
            background: #238636;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
            text-align: center;
            min-width: 90px;
        }

        .download-link:hover {
            background: #2ea043;
        }

        .download-link.placeholder {
            background: #21262d;
            color: #484f58;
            cursor: default;
        }

        .download-link.placeholder:hover {
            background: #21262d;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #484f58;
            font-size: 13px;
        }

        @media (max-width: 520px) {
            th, td {
                padding: 12px 14px;
                font-size: 14px;
            }
            .download-link {
                padding: 6px 14px;
                min-width: 70px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦊 Nokim Explorer</h1>
            <p>نسخه‌های انتشار · دانلود مستقیم</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>نسخه</th>
                    <th>تاریخ انتشار</th>
                    <th>دانلود</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="version">v1.0</span></td>
                    <td class="date">۱۴۰۵/۵/۱۲</td>
                    <td><a href="#" class="download-link placeholder">لینک دانلود</a></td>
                </tr>
                <tr>
                    <td><span class="version">v1.1</span></td>
                    <td class="date">۱۴۰۵/۵/۱۹</td>
                    <td><a href="
https://drive.usercontent.google.com/download?id=1jCXb7R2i4kylF2CUyYfR6jb-6VyczbDA&export" class="download-link placeholder">لینک دانلود</a></td>
                </tr>
                <tr>
                    <td><span class="version">v1.2</span></td>
                    <td class="date">۱۴۰۵/۵/۳۰</td>
                    <td><a href="https://drive.usercontent.google.com/download?id=1iFwYkLPvE59wqZAfac0ikhwggqACgoYv&export=download&authuser=0" class="download-link placeholder">لینک دانلود</a></td>
                </tr>
            </tbody>
        </table>

        <div class="footer">
            (C) NOKIM 2026 🚀
        </div>
    </div>
</body>
</html>
