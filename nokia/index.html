
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<!-- سازگاری با گوشی‌های قدیمی -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="HandheldFriendly" content="true">
<meta name="MobileOptimized" content="240">

<title>Nokim Explorer</title>

<link rel="icon" href="NOKIM2026.ico" type="image/x-icon">

<style>
/* تنظیمات پایه */
* {
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
}

body {
  width: 100%;
  min-width: 0;
  min-height: 100vh;
  margin: 0;
  padding: 0;
  background: #ffffff;
  color: #202124;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  overflow-x: hidden;
}

/* سربرگ */
.header {
  width: 100%;
  min-height: 45px;
  padding: 6px 10px;
  text-align: right;
}

.header a {
  display: inline-block;
  padding: 10px 8px;
  color: #202124;
  text-decoration: none;
}

/* محتوای اصلی */
.main-content {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  padding: 40px 12px 35px;
  text-align: center;
}

/* لوگو */
.logo-text {
  width: 100%;
  margin: 0 auto 28px;
  color: #3c4043;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 56px;
  font-weight: bold;
  letter-spacing: -2px;
  text-align: center;
  overflow-wrap: break-word;
  word-wrap: break-word;
}

/* کادر جستجو */
.search-box {
  width: 100%;
  max-width: 584px;
  margin: 0 auto;
}

.search-container {
  display: table;
  width: 100%;
  height: 46px;
  padding: 0 12px;
  border: 1px solid #dadce0;
  border-radius: 24px;
  background: #ffffff;
}

.search-icon {
  display: table-cell;
  width: 25px;
  vertical-align: middle;
  text-align: center;
  color: #9aa0a6;
}

.search-input {
  display: table-cell;
  width: 100%;
  height: 42px;
  padding: 0 5px;
  border: 0;
  outline: 0;
  background: transparent;
  color: #202124;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
}

/* دکمه‌ها */
.search-buttons {
  width: 100%;
  margin-top: 20px;
  text-align: center;
}

.search-buttons button {
  display: inline-block;
  max-width: 100%;
  min-height: 38px;
  margin: 4px 2px;
  padding: 8px 12px;
  border: 1px solid #dadce0;
  border-radius: 5px;
  background: #f8f9fa;
  color: #3c4043;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
  cursor: pointer;
}

/* انتخاب زبان */
.language-bar {
  width: 100%;
  margin-top: 28px;
  padding: 0 4px;
  color: #474747;
  font-size: 12px;
  line-height: 28px;
  text-align: center;
}

.language-bar a {
  display: inline-block;
  margin: 0 3px;
  color: #1a0dab;
  text-decoration: none;
  white-space: nowrap;
}

/* پابرگ */
.footer {
  width: 100%;
  margin-top: 20px;
  padding: 10px;
  background: #f3f5f6;
  text-align: center;
  overflow-wrap: break-word;
}

.footer a {
  display: inline-block;
  padding: 9px 12px;
  color: #202124;
  text-decoration: none;
  font-size: 13px;
}

/* نمایشگرهای متوسط */
@media screen and (min-width: 600px) {
  .main-content {
    padding-top: 70px;
  }

  .logo-text {
    font-size: 72px;
  }

  .search-container {
    height: 50px;
  }

  .search-input {
    height: 46px;
  }

  .language-bar {
    font-size: 13px;
  }
}

/* گوشی‌های باریک نوکیا و Opera Mini */
@media screen and (max-width: 360px) {
  .main-content {
    padding: 25px 10px 25px;
  }

  .logo-text {
    font-size: 32px;
    letter-spacing: -1px;
    margin-bottom: 22px;
  }

  .search-container {
    height: 42px;
    padding: 0 8px;
  }

  .search-input {
    height: 38px;
    font-size: 16px;
  }

  .search-buttons {
    margin-top: 14px;
  }

  .search-buttons button {
    width: 100%;
    min-height: 36px;
    margin: 4px 0;
    padding: 7px 5px;
  }

  .language-bar {
    margin-top: 20px;
    font-size: 12px;
    line-height: 26px;
  }

  .footer {
    padding: 8px 4px;
  }
}

/* گوشی‌های بسیار قدیمی */
@media screen and (max-width: 260px) {
  .main-content {
    padding-right: 6px;
    padding-left: 6px;
  }

  .logo-text {
    font-size: 26px;
  }

  .search-container {
    padding: 0 5px;
  }

  .language-bar a {
    margin: 0 2px;
  }
}
</style>
</head>

<body>

<div class="header">
  <a href="https://nokim69.github.io/about.html"
     data-i18n="about">درباره</a>
</div>

<div class="main-content">

  <div class="logo-text" id="logoText">
    Nokim Explorer
  </div>

  <div class="search-box">

    <form id="searchForm"
          action="https://nokim69.github.io/results.html"
          method="get">

      <div class="search-container">

        <span class="search-icon" aria-hidden="true">
          &#128269;
        </span>

        <input
          class="search-input"
          id="searchInput"
          type="text"
          name="q"
          placeholder="جستجو کنید ..."
          aria-label="جستجو"
          autocomplete="off"
          required
        >

      </div>

      <div class="search-buttons">

        <button type="submit" data-i18n="searchBtn">
          جستجوی Nokim
        </button>

        <button type="submit"
                name="btnI"
                value="1"
                data-i18n="luckyBtn">
          احساس خوش‌شانسی می‌کنم
        </button>

      </div>

    </form>

  </div>

  <div class="language-bar">

    <span id="langLabel">
      Nokim Explorer به این زبان ارائه می‌شود:
    </span>

    <br>

    <a href="#"
       data-lang="en">English</a>

    <a href="#"
       data-lang="ru">Русский</a>

    <a href="#"
       data-lang="tr">Türkçe</a>

    <a href="#"
       data-lang="zh">中文</a>

    <a href="#"
       data-lang="fa">فارسی</a>

  </div>

</div>

<div class="footer">

  <a href="https://nokim69.github.io/about.html"
     data-i18n="about">درباره</a>

  <a href="https://nokim69.github.io/about.html"
     data-i18n="privacy">حریم خصوصی</a>

</div>

<script>
(function () {

  var translations = {

    fa: {
      title: "Nokim Explorer",
      placeholder: "جستجو کنید ...",
      searchBtn: "جستجوی Nokim",
      luckyBtn: "احساس خوش‌شانسی می‌کنم",
      langLabel: "Nokim Explorer به این زبان ارائه می‌شود:",
      about: "درباره",
      privacy: "حریم خصوصی",
      direction: "rtl"
    },

    en: {
      title: "Nokim Explorer",
      placeholder: "Search...",
      searchBtn: "Nokim Search",
      luckyBtn: "I'm Feeling Lucky",
      langLabel: "Nokim Explorer is offered in:",
      about: "About",
      privacy: "Privacy",
      direction: "ltr"
    },

    ru: {
      title: "Nokim Explorer",
      placeholder: "Поиск...",
      searchBtn: "Поиск Nokim",
      luckyBtn: "Мне повезёт",
      langLabel: "Nokim Explorer доступен на языках:",
      about: "О нас",
      privacy: "Конфиденциальность",
      direction: "ltr"
    },

    tr: {
      title: "Nokim Explorer",
      placeholder: "Поиск yapın...",
      searchBtn: "Nokim'de Ara",
      luckyBtn: "Kendimi Şanslı Hissediyorum",
      langLabel: "Nokim Explorer şu dillerde sunulur:",
      about: "Hakkında",
      privacy: "Gizlilik",
      direction: "ltr"
    },

    zh: {
      title: "Nokim Explorer",
      placeholder: "搜索...",
      searchBtn: "搜索 Nokim",
      luckyBtn: "手气不错",
      langLabel: "Nokim Explorer 提供以下语言：",
      about: "关于",
      privacy: "隐私",
      direction: "ltr"
    }

  };

  function detectLanguage() {
    var language = navigator.language || "fa";
    language = language.toLowerCase();

    if (language.indexOf("ru") === 0) return "ru";
    if (language.indexOf("tr") === 0) return "tr";
    if (language.indexOf("zh") === 0) return "zh";
    if (language.indexOf("en") === 0) return "en";

    return "fa";
  }

  function applyLanguage(lang) {

    var t = translations[lang];

    if (!t) return;

    document.documentElement.lang = lang;
    document.documentElement.dir = t.direction;
    document.title = t.title;

    document.getElementById("logoText").innerHTML = t.title;

    document.getElementById("searchInput").placeholder =
      t.placeholder;

    document.getElementById("langLabel").innerHTML =
      t.langLabel;

    var elements = document.querySelectorAll("[data-i18n]");
    var i;

    for (i = 0; i < elements.length; i++) {
      var key = elements[i].getAttribute("data-i18n");

      if (t[key]) {
        elements[i].innerHTML = t[key];
      }
    }

    try {
      localStorage.setItem("nokimLang", lang);
    } catch (e) {
      /* در مرورگرهایی که ذخیره‌سازی را محدود می‌کنند */
    }
  }

  var links = document.querySelectorAll("[data-lang]");
  var i;

  for (i = 0; i < links.length; i++) {
    links[i].onclick = function (event) {

      if (event && event.preventDefault) {
        event.preventDefault();
      }

      applyLanguage(this.getAttribute("data-lang"));

      return false;
    };
  }

  var savedLanguage = null;

  try {
    savedLanguage = localStorage.getItem("nokimLang");
  } catch (e) {
    savedLanguage = null;
  }

  if (!translations[savedLanguage]) {
    savedLanguage = detectLanguage();
  }

  applyLanguage(savedLanguage);

  document.getElementById("searchForm").onsubmit = function () {
    var input = document.getElementById("searchInput");

    if (!input.value.replace(/^\s+|\s+$/g, "")) {
      input.focus();
      return false;
    }

    return true;
  };

})();
</script>

</body>
</html>
